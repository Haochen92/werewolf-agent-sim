# Alembic config for server-owned Postgres tables (the replay archive; live-session
# durability later). The database URL is DELIBERATELY absent here: alembic/env.py
# injects it from WW_POSTGRES_DSN at runtime, so no credential ever lives in the repo
# (a deliberate deviation from the dota2pred exemplar this scaffold was adopted from).
#
# Usage:  poetry run alembic upgrade head      (requires WW_POSTGRES_DSN, e.g. via .env)

[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
