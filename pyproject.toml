[project]
name = "werewolf-game"
version = "0.1.0"
description = "LangGraph Werewolf game agents modularized from exercise 7."
readme = "README.md"
requires-python = "==3.11.12"
authors = [{ name = "liuhaochen" }]
dependencies = [
    "langchain-core==1.3.3",
    "langchain-google-genai==4.2.2",
    "langchain==1.2.18",
    "langgraph==1.1.10",
    "langfuse==3.14.6",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "pytoml==0.1.21",
    "trustcall==0.0.39",
    "numpy==2.4.4",
    "scipy>=1.16.0",
    "pandas (>=3.0.3,<4.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "langchain-google-vertexai (>=3.2.3,<4.0.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
]

[project.scripts]
werewolf-game = "Agents.main:main"
memory-batch-dedup = "Agents.memory.batch_deduplication:main"
eval-build-dataset = "evaluation.src.data.builders.agent_decision:main"
eval-summary = "evaluation.src.experiments.frozen_case_evals.situation_summary_pairwise:main"
eval-summary-rubric = "evaluation.src.experiments.frozen_case_evals.situation_summary_rubric:main"
eval-retrieval = "evaluation.src.experiments.frozen_case_evals.retrieval:main"
eval-application = "evaluation.src.experiments.frozen_case_evals.application:main"
eval-captured = "evaluation.src.experiments.frozen_case_evals.captured_judge:main"
eval-e2e = "evaluation.src.experiments.frozen_case_evals.e2e:main"
eval-build-extraction-dataset = "evaluation.src.data.builders.extraction:main"
eval-build-dedup-dataset = "evaluation.src.data.builders.dedup:main"
eval-extraction = "evaluation.src.experiments.frozen_case_evals.extraction_judge:main"
eval-day-summary = "evaluation.src.experiments.frozen_case_evals.day_summary_judge:main"
eval-dedup = "evaluation.src.experiments.frozen_case_evals.dedup_judge:main"
eval-dedup-score = "evaluation.src.audits.dedup_score:main"
eval-batch-dedup = "evaluation.src.experiments.frozen_case_evals.batch_dedup_judge:main"
eval-graduate = "evaluation.src.experiments.graduate:main"
eval-case-sample = "evaluation.src.experiments.case_sampler:main"
eval-tagger = "evaluation.src.experiments.tagger_eval:main"

[tool.poetry]
packages = [{ include = "Agents" }, { include = "evaluation" }]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.0"
ruff = "^0.8.0"
modal = "^1.4.3"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
