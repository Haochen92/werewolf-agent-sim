[project]
name = "werewolf-game"
version = "0.1.0"
description = "LangGraph Werewolf game agents modularized from exercise 7."
readme = "README.md"
requires-python = "==3.11.12"
authors = [{ name = "liuhaochen" }]
dependencies = [
    "langchain-core==1.3.3",
    "langchain-google-genai==4.2.2",
    "langchain==1.2.18",
    "langgraph==1.1.10",
    "langfuse==3.14.6",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "pytoml==0.1.21",
    "trustcall==0.0.39",
    "numpy==2.4.4",
    "scipy>=1.16.0",
    "pandas (>=3.0.3,<4.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "langchain-google-vertexai (>=3.2.3,<4.0.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "psycopg[binary,pool]==3.3.4",
    "langgraph-checkpoint-postgres==3.1.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic-settings==2.15.0",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "alembic (>=1.19.1,<2.0.0)",
]

[project.scripts]
werewolf-game = "Agents.main:main"
memory-batch-dedup = "Agents.memory.batch_deduplication:main"
memory-tick = "Agents.memory.consolidation.tick:main"
eval-build-dataset = "evaluation.src.data.builders.agent_decision:main"
eval-summary = "evaluation.src.cli_runner.regen_replay.both.situation_summary_pairwise:main"
eval-summary-rubric = "evaluation.src.cli_runner.regen_replay.both.situation_summary_rubric:main"
eval-retrieval = "evaluation.src.cli_runner.regen_replay.both.retrieval:main"
eval-turn = "evaluation.src.cli_runner.regen_replay.both.turn_eval:main"
eval-application = "evaluation.src.cli_runner.regen_replay.both.turn_eval:main"
eval-captured = "evaluation.src.cli_runner.regen_replay.both.turn_eval:main"
eval-e2e = "evaluation.src.cli_runner.regen_replay.both.turn_eval:main"
eval-build-extraction-dataset = "evaluation.src.data.builders.extraction:main"
eval-build-dedup-dataset = "evaluation.src.data.builders.dedup:main"
eval-extraction = "evaluation.src.cli_runner.regen_replay.judge.extraction_judge:main"
eval-day-summary = "evaluation.src.cli_runner.regen_replay.both.day_summary_judge:main"
eval-dedup = "evaluation.src.cli_runner.regen_replay.judge.dedup_judge:main"
eval-dedup-score = "evaluation.src.audits.dedup_score:main"
eval-role-hallucination = "evaluation.src.audits.role_hallucination_screen:main"
eval-role-hallucination-read = "evaluation.src.judges.role_fact_read:main"
eval-batch-dedup = "evaluation.src.cli_runner.regen_replay.both.batch_dedup_judge:main"
eval-graduate = "evaluation.src.cli_runner.graduate_run:main"
eval-case-sample = "evaluation.src.cli_runner.diagnosis.case_sampler:main"
eval-tagger = "evaluation.src.cli_runner.discussion_tagger_eval:main"
eval-checkpoint-replay = "evaluation.src.replay.decision_screen.checkpoint_replay:main"

[tool.poetry]
packages = [{ include = "Agents" }, { include = "evaluation" }]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.0"
ruff = "^0.8.0"
modal = "^1.4.3"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
polyfactory = "^3.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root on sys.path: `poetry run pytest` works bare (Agents/, server/,
# evaluation/ import without the `python -m` cwd trick).
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "live: needs network/credentials (LLM calls, live Postgres) — excluded from the offline suite",
]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
