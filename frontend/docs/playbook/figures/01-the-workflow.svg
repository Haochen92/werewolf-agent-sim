<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">From an idea to a shipped page, with AI in each role</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">Eight stages. Under each: who did it here. Red marks: the owner&#x27;s checkpoints. Dashed arrows: the loops back.</text>
<rect x="24" y="110" width="210" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="40" y="140" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">1  Idea</text>
<text x="40" y="170" font-size="13.5" fill="#1f2937" text-anchor="start">you + Claude chat</text>
<text x="40" y="191" font-size="13.5" fill="#1f2937" text-anchor="start">rulings, design log</text>
<rect x="264" y="110" width="210" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="280" y="140" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">2  Design</text>
<text x="280" y="170" font-size="13.5" fill="#1f2937" text-anchor="start">Claude chat mockups,</text>
<text x="280" y="191" font-size="13.5" fill="#1f2937" text-anchor="start">variations per round</text>
<rect x="504" y="110" width="210" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="520" y="140" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">3  Assets</text>
<text x="520" y="170" font-size="13.5" fill="#1f2937" text-anchor="start">ChatGPT raster images,</text>
<text x="520" y="191" font-size="13.5" fill="#1f2937" text-anchor="start">scripts bake and shrink</text>
<rect x="744" y="110" width="210" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="760" y="140" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">4  Spec</text>
<text x="760" y="170" font-size="13.5" fill="#1f2937" text-anchor="start">event schema, beat sheet</text>
<text x="760" y="191" font-size="13.5" fill="#1f2937" text-anchor="start">(you wrote / co-wrote)</text>
<rect x="744" y="330" width="210" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="760" y="360" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">5  Build</text>
<text x="760" y="390" font-size="13.5" fill="#1f2937" text-anchor="start">Claude in VS Code,</text>
<text x="760" y="411" font-size="13.5" fill="#1f2937" text-anchor="start">the workbench to see</text>
<rect x="504" y="330" width="210" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="520" y="360" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">6  Test</text>
<text x="520" y="390" font-size="13.5" fill="#1f2937" text-anchor="start">agent-written tests,</text>
<text x="520" y="411" font-size="13.5" fill="#1f2937" text-anchor="start">you on the phone</text>
<rect x="264" y="330" width="210" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="280" y="360" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">7  Ship</text>
<text x="280" y="390" font-size="13.5" fill="#1f2937" text-anchor="start">clean-commit deploy,</text>
<text x="280" y="411" font-size="13.5" fill="#1f2937" text-anchor="start">rollback image, smoke</text>
<rect x="24" y="330" width="210" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="40" y="360" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">8  Learn</text>
<text x="40" y="390" font-size="13.5" fill="#1f2937" text-anchor="start">lesson log, challenge</text>
<text x="40" y="411" font-size="13.5" fill="#1f2937" text-anchor="start">record, code walks</text>
<path d="M234,170.0 L262,170.0" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M474,170.0 L502,170.0" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M714,170.0 L742,170.0" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M744,390.0 L716,390.0" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M504,390.0 L476,390.0" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M264,390.0 L236,390.0" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M849.0,230 L849.0,328" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="274" y="238" width="190" height="26" rx="13" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="369.0" y="256" font-size="12.5" fill="#7f1d1d" text-anchor="middle">you pick a variant</text>
<rect x="514" y="238" width="190" height="26" rx="13" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="609.0" y="256" font-size="12.5" fill="#7f1d1d" text-anchor="middle">you approve each asset</text>
<rect x="514" y="458" width="190" height="26" rx="13" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="609.0" y="476" font-size="12.5" fill="#7f1d1d" text-anchor="middle">you see before/after</text>
<rect x="274" y="458" width="190" height="26" rx="13" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="369.0" y="476" font-size="12.5" fill="#7f1d1d" text-anchor="middle">smoke, then you on the device</text>
<path d="M129.0,450 L129.0,512 L849.0,512" stroke="#374151" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<path d="M669.0,512 L669.0,490" stroke="#374151" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
<path d="M849.0,512 L849.0,454" stroke="#374151" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
<path d="M129.0,512 L12,512 L12,90 L369.0,90 L369.0,106" stroke="#374151" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="139.0" y="504" font-size="13" fill="#4b5563" text-anchor="start">a finding goes back to design, build or test</text>
<rect x="24" y="568" width="952" height="58" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="596" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The rule that makes it work with AI builders</text>
<text x="44" y="614" font-size="14.5" fill="#1f2937" text-anchor="start">Every stage ends at a checkpoint the owner can judge from a picture or a test, never from a description.</text>
</svg>