<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="560" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">Beats, and the folds behind them</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">beatsFor cuts the log into beats; each beat names how far into the log it reaches (end).</text>
<text x="24" y="108" font-size="13" fill="#4b5563" text-anchor="start">the log</text>
<rect x="110" y="90" width="840" height="28" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<line x1="110" y1="118" x2="110" y2="128" stroke="#6b7280"/>
<text x="110" y="144" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">0</text>
<line x1="320.0" y1="118" x2="320.0" y2="128" stroke="#6b7280"/>
<text x="320.0" y="144" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">40</text>
<line x1="530.0" y1="118" x2="530.0" y2="128" stroke="#6b7280"/>
<text x="530.0" y="144" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">85</text>
<line x1="630.8" y1="118" x2="630.8" y2="128" stroke="#6b7280"/>
<text x="630.8" y="144" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">100</text>
<line x1="740.0" y1="118" x2="740.0" y2="128" stroke="#6b7280"/>
<text x="740.0" y="144" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">120</text>
<line x1="950" y1="118" x2="950" y2="128" stroke="#6b7280"/>
<text x="950" y="144" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">593</text>
<text x="24" y="186" font-size="13" fill="#4b5563" text-anchor="start">beats</text>
<rect x="148.0" y="166" width="92" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="194.0" y="186" font-size="12" fill="#1f2937" text-anchor="middle">deal</text>
<line x1="194.0" y1="166" x2="194.0" y2="118" stroke="#1d4ed8" stroke-dasharray="3 3"/>
<rect x="274.0" y="166" width="92" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="320.0" y="186" font-size="12" fill="#1f2937" text-anchor="middle">dawn</text>
<line x1="320.0" y1="166" x2="320.0" y2="118" stroke="#1d4ed8" stroke-dasharray="3 3"/>
<rect x="383.2" y="166" width="92" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="429.2" y="186" font-size="12" fill="#1f2937" text-anchor="middle">seat 3 speaks</text>
<line x1="429.2" y1="166" x2="429.2" y2="118" stroke="#1d4ed8" stroke-dasharray="3 3"/>
<rect x="484.0" y="166" width="92" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="530.0" y="186" font-size="12" fill="#1f2937" text-anchor="middle">seat 4 passes</text>
<line x1="530.0" y1="166" x2="530.0" y2="118" stroke="#1d4ed8" stroke-dasharray="3 3"/>
<rect x="584.8" y="166" width="92" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="630.8" y="186" font-size="12" fill="#1f2937" text-anchor="middle">ballots</text>
<line x1="630.8" y1="166" x2="630.8" y2="118" stroke="#1d4ed8" stroke-dasharray="3 3"/>
<rect x="694.0" y="166" width="92" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="740.0" y="186" font-size="12" fill="#1f2937" text-anchor="middle">verdict</text>
<line x1="740.0" y1="166" x2="740.0" y2="118" stroke="#1d4ed8" stroke-dasharray="3 3"/>
<text x="24" y="236" font-size="13" fill="#4b5563" text-anchor="start">folds kept</text>
<rect x="88" y="218" width="44" height="28" rx="14" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="110" y="237" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">0</text>
<rect x="298.0" y="218" width="44" height="28" rx="14" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="320.0" y="237" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">40</text>
<rect x="508.0" y="218" width="44" height="28" rx="14" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="530.0" y="237" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">85</text>
<rect x="608.8" y="218" width="44" height="28" rx="14" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="630.8" y="237" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">100</text>
<path d="M554.0,258 Q580.4,282 626.8,258" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="580.4" y="300" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">folds 15 events</text>
<rect x="24" y="320" width="452" height="220" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="44" y="348" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">Stepping forward to “ballots” (end 100)</text>
<text x="44" y="374" font-size="14" fill="#1f2937" text-anchor="start">The nearest kept fold at or before 100 is 85.</text>
<text x="44" y="398" font-size="14" fill="#1f2937" text-anchor="start">Fold events 86 to 100 onto it, keep the result.</text>
<text x="44" y="422" font-size="14" fill="#1f2937" text-anchor="start">Stepping back to “dawn” (end 40) folds nothing:</text>
<text x="44" y="446" font-size="14" fill="#1f2937" text-anchor="start">that view is already kept.</text>
<text x="44" y="470" font-size="14" fill="#1f2937" text-anchor="start">96 folds are kept, the oldest out; the empty</text>
<text x="44" y="494" font-size="14" fill="#1f2937" text-anchor="start">view at 0 always stays.</text>
<rect x="500" y="320" width="456" height="220" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="520" y="348" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">A live game: the log grows</text>
<text x="520" y="374" font-size="14" fill="#1f2937" text-anchor="start">grow() takes the longer log when it only adds</text>
<text x="520" y="398" font-size="14" fill="#1f2937" text-anchor="start">to the end, so every fold already made stays good.</text>
<text x="520" y="422" font-size="14" fill="#1f2937" text-anchor="start">If an event was inserted earlier (the reveal),</text>
<text x="520" y="446" font-size="14" fill="#1f2937" text-anchor="start">grow() says no and a fresh cache is made.</text>
<text x="520" y="470" font-size="14" fill="#1f2937" text-anchor="start">Safe to share because the fold never edits</text>
<text x="520" y="494" font-size="14" fill="#1f2937" text-anchor="start">a view; each event makes a new one (figure 4).</text>
</svg>