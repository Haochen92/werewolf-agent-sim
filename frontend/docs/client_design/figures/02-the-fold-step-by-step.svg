<text x="44" y="502" font-size="16" fill="#111827" font-weight="bold">In code</text>
<text x="44" y="528" font-size="14.5" fill="#111827">foldEvent(view, event) → a new view.  Each event type has one case (33 of them) that says what it changes.</text>
<text x="44" y="554" font-size="14.5" fill="#111827">foldEvents(events) = start from the empty view and apply foldEvent once per event, in seq order.</text>
<text x="44" y="580" font-size="14.5" fill="#111827">The live store does the same, one row at a time as events arrive; a replay does it up to the scene on screen.</text>
