<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827">The fold, one event at a time</text>
<text x="24" y="62" font-size="14" fill="#4b5563">Each row is the view after the event on its left. Green: what that event's case in the fold changed. Grey: carried over untouched.</text>
