<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">The open turn: an old answer must not close a new question</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">Two sources describe the viewer&#x27;s turn: the stream (the request) and the status poll (is it still open?).</text>
<rect x="70" y="84" width="160" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="150" y="106" font-size="14.5" font-weight="bold" fill="#1f2937" text-anchor="middle">status poll</text>
<line x1="150" y1="118" x2="150" y2="440" stroke="#9ca3af" stroke-dasharray="4 4"/>
<rect x="410" y="84" width="160" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="490" y="106" font-size="14.5" font-weight="bold" fill="#1f2937" text-anchor="middle">page</text>
<line x1="490" y1="118" x2="490" y2="440" stroke="#9ca3af" stroke-dasharray="4 4"/>
<rect x="750" y="84" width="160" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="830" y="106" font-size="14.5" font-weight="bold" fill="#1f2937" text-anchor="middle">stream</text>
<line x1="830" y1="118" x2="830" y2="440" stroke="#9ca3af" stroke-dasharray="4 4"/>
<path d="M490,150 L150,150" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="320" y="142" font-size="13" fill="#1f2937" text-anchor="middle">poll asked</text>
<text x="80" y="190" font-size="12.5" fill="#4b5563" text-anchor="start">server answers as of</text>
<text x="80" y="207" font-size="12.5" fill="#4b5563" text-anchor="start">seq 118: no turn open</text>
<path d="M830,250 L490,250" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="660" y="242" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">input_request  seq 120</text>
<rect x="380" y="262" width="220" height="34" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="490" y="284" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="middle">your turn opens</text>
<path d="M150,330 L490,330" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#r)"/>
<text x="320" y="322" font-size="13" fill="#b91c1c" text-anchor="middle">answer arrives late</text>
<text x="320" y="350" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#b91c1c" text-anchor="middle">last_seq 118, pending: none</text>
<rect x="340" y="372" width="300" height="52" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="490" y="393" font-size="13.5" fill="#1f2937" text-anchor="middle">without the guard: turn closed,</text>
<text x="490" y="412" font-size="13.5" fill="#1f2937" text-anchor="middle">the viewer cannot answer</text>
<rect x="24" y="460" width="932" height="124" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="488" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The guard (syncPending)</text>
<text x="44" y="514" font-size="14.5" fill="#1f2937" text-anchor="start">A status may change a request only if it could have seen it: request seq ≤ the status&#x27;s last_seq.</text>
<text x="44" y="537" font-size="14.5" fill="#1f2937" text-anchor="start">Here 120 &gt; 118, so the late answer is ignored and the turn stays open; the next poll confirms it.</text>
<text x="44" y="560" font-size="14.5" fill="#1f2937" text-anchor="start">The same check stops an older status copying the previous turn&#x27;s passed deadline onto the new one.</text>
</svg>