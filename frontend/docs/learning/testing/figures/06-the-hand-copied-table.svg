<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="590" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">The tests check the page against a copy of the server&#x27;s rule</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">Who may see which event live is decided by the server. The two client suites each keep their own copy.</text>
<rect x="30" y="112" width="300" height="120" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="46" y="138" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">The server (the truth)</text>
<text x="46" y="164" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">server/schemas/events.py</text>
<text x="46" y="184" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">EVENT_TIERS, read by</text>
<text x="46" y="204" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">entitlement.py::entitled</text>
<rect x="370" y="112" width="270" height="120" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="386" y="138" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">Browser suite</text>
<text x="386" y="164" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">e2e/live.spec.ts</text>
<text x="386" y="184" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">OBSERVER, FACTION, SEAT</text>
<text x="386" y="204" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">filter a mocked stream</text>
<rect x="680" y="112" width="270" height="120" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="696" y="138" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">Unit tests</text>
<text x="696" y="164" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">live-state.test.ts</text>
<text x="696" y="184" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">OBSERVER, FACTION, SEAT</text>
<text x="696" y="204" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">filter Session&#x27;s feed</text>
<path d="M330,172 L368,172" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="6 4"/>
<path d="M180,112 Q496,62 812,110" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text x="660" y="254" font-size="13" font-style="italic" fill="#4b5563" text-anchor="middle">both copied by hand on 2026-09-25; nothing compares them with the server</text>
<text x="30" y="306" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">One event type, read on 2026-10-26: day_summary_structured</text>
<rect x="30" y="322" width="300" height="70" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="46" y="348" font-size="13.5" fill="#1f2937" text-anchor="start">public</text>
<text x="46" y="370" font-size="13.5" fill="#1f2937" text-anchor="start">since 2026-10-04 (34c5e1bf)</text>
<rect x="370" y="322" width="270" height="70" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="386" y="348" font-size="13.5" fill="#1f2937" text-anchor="start">not listed, so public</text>
<text x="386" y="370" font-size="13.5" fill="#1f2937" text-anchor="start">(dropped 2026-10-04, 9ac9d734)</text>
<rect x="680" y="322" width="270" height="70" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="696" y="348" font-size="13.5" fill="#1f2937" text-anchor="start">still listed as observer:</text>
<text x="696" y="370" font-size="13.5" fill="#1f2937" text-anchor="start">withheld from the seat</text>
<rect x="30" y="414" width="920" height="158" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="50" y="442" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">What follows</text>
<text x="50" y="468" font-size="14.5" fill="#1f2937" text-anchor="start">A tier changed on the server passes both suites: they test the page against their copy.</text>
<text x="50" y="491" font-size="14.5" fill="#1f2937" text-anchor="start">The browser suite never meets the server at all; its API is answered by page.route.</text>
<text x="50" y="514" font-size="14.5" fill="#1f2937" text-anchor="start">No CI runs either suite, so a drift is found only by reading, as here.</text>
<text x="50" y="537" font-size="14.5" fill="#1f2937" text-anchor="start">Neither copy lists the ten-seat seat events (uses_remaining, night_record); the nine-seat</text>
<text x="50" y="560" font-size="14.5" fill="#1f2937" text-anchor="start">fixture they feed holds none, so today that gap changes nothing.</text>
</svg>