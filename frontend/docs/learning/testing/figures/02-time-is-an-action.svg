<text x="410" y="380" font-size="13" fill="#374151" text-anchor="start">no clock, no network, no waiting:</text>
<text x="410" y="400" font-size="13" fill="#374151" text-anchor="start">the whole day runs in milliseconds</text>
<rect x="30" y="446" width="920" height="98" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="50" y="474" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Why it is cheap</text>
<text x="50" y="500" font-size="14.5" fill="#1f2937" text-anchor="start">Same inputs, same state, every time: no timer to wait for, no flake from a slow machine.</text>
<text x="50" y="523" font-size="14.5" fill="#1f2937" text-anchor="start">The timer lives in the container, so the container is the part these tests do not cover.</text>
</svg>