<rect width="980" height="560" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">Time is an action, so a test can play a game without waiting</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">liveReducer never reads a clock. The page turns a timer into an action; the test sends the same action at once.</text>
