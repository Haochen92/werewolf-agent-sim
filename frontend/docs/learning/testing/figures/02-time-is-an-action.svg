<text x="640" y="348" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">day.speech</text>
<text x="640" y="365" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">day.pass  (seats 2, 4 and 10)</text>
