<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="580" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A ceiling is not a delay: wait for the state, sized to the work</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">live.spec.ts, the game-over-in-the-night test, as found on 2026-10-02: 406 stream frames read before the page answered.</text>
<line x1="150" y1="380" x2="910.0" y2="380" stroke="#6b7280" stroke-width="1.2"/>
<line x1="150.0" y1="380" x2="150.0" y2="386" stroke="#6b7280"/>
<text x="150.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">0 s</text>
<line x1="230.0" y1="380" x2="230.0" y2="386" stroke="#6b7280"/>
<text x="230.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">10 s</text>
<line x1="310.0" y1="380" x2="310.0" y2="386" stroke="#6b7280"/>
<text x="310.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">20 s</text>
<line x1="390.0" y1="380" x2="390.0" y2="386" stroke="#6b7280"/>
<text x="390.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">30 s</text>
<line x1="470.0" y1="380" x2="470.0" y2="386" stroke="#6b7280"/>
<text x="470.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">40 s</text>
<line x1="550.0" y1="380" x2="550.0" y2="386" stroke="#6b7280"/>
<text x="550.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">50 s</text>
<line x1="630.0" y1="380" x2="630.0" y2="386" stroke="#6b7280"/>
<text x="630.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">60 s</text>
<line x1="710.0" y1="380" x2="710.0" y2="386" stroke="#6b7280"/>
<text x="710.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">70 s</text>
<line x1="790.0" y1="380" x2="790.0" y2="386" stroke="#6b7280"/>
<text x="790.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">80 s</text>
<line x1="870.0" y1="380" x2="870.0" y2="386" stroke="#6b7280"/>
<text x="870.0" y="402" font-size="12" fill="#4b5563" text-anchor="middle">90 s</text>
<text x="30" y="140" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">alone</text>
<rect x="150" y="120" width="176.0" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="158" y="140" font-size="12.5" fill="#1f2937" text-anchor="start">reading the frames</text>
<text x="402.0" y="140" font-size="13" fill="#15803d" text-anchor="start">passed alone (its time was not recorded)</text>
<text x="30" y="205" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">3 workers</text>
<rect x="150" y="185" width="264.0" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="158" y="205" font-size="12.5" fill="#1f2937" text-anchor="start">reading the frames, slower</text>
<text x="426.0" y="205" font-size="13" fill="#1f2937" text-anchor="start">about 33 s: past the old wait (build_log §8.10)</text>
<line x1="390.0" y1="100" x2="390.0" y2="380" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="384.0" y="262" font-size="13" fill="#b91c1c" text-anchor="end">old wait: 30 s</text>
<text x="384.0" y="280" font-size="13" fill="#b91c1c" text-anchor="end">gave up first under 3 workers</text>
<line x1="879.6" y1="100" x2="879.6" y2="380" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/>
<text x="873.6" y="262" font-size="13" fill="#15803d" text-anchor="end">landsOn: 10 s + 200 ms</text>
<text x="873.6" y="280" font-size="13" fill="#15803d" text-anchor="end">x 406 frames = 91.2 s</text>
<text x="873.6" y="316" font-size="13" fill="#15803d" text-anchor="end">returns the moment data-beat</text>
<text x="873.6" y="334" font-size="13" fill="#15803d" text-anchor="end">says night.hub; the rest unused</text>
<rect x="30" y="420" width="920" height="146" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="50" y="448" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Three kinds of wait</text>
<text x="50" y="474" font-size="14.5" fill="#1f2937" text-anchor="start">waitForTimeout(5000): always costs 5 s, and is still too short on a slow day. Right only for a</text>
<text x="50" y="497" font-size="14.5" fill="#1f2937" text-anchor="start">measurement window (the phone gate watches each beat for 3.2 s on purpose).</text>
<text x="50" y="520" font-size="14.5" fill="#1f2937" text-anchor="start">expect(locator).toHaveAttribute(..., { timeout }): polls until true; the timeout is a ceiling.</text>
<text x="50" y="543" font-size="14.5" fill="#1f2937" text-anchor="start">page.clock.pauseAt / runFor: the test owns the page&#x27;s clock, so a 6 s hold costs no real time.</text>
</svg>