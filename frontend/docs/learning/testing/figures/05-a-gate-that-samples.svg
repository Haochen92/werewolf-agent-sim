<text x="561.0" y="338" font-size="12.5" fill="#b91c1c" text-anchor="start">first gate: missed</text>
<rect x="30" y="440" width="920" height="146" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="50" y="468" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">What the samples still miss (2026-10-11 audit)</text>
<text x="50" y="494" font-size="14.5" fill="#1f2937" text-anchor="start">A finding needs two sightings, so anything under about 300 ms can pass between them.</text>
<text x="50" y="517" font-size="14.5" fill="#1f2937" text-anchor="start">A node gone at the end is skipped (!el.isConnected), so an exit animation escapes.</text>
<text x="50" y="540" font-size="14.5" fill="#1f2937" text-anchor="start">Cost is inferred from DOM boxes and style writes, not read from the compositor; and the</text>
<text x="50" y="563" font-size="14.5" fill="#1f2937" text-anchor="start">will-change ban is the project&#x27;s conservative policy, not a law of browsers.</text>
</svg>