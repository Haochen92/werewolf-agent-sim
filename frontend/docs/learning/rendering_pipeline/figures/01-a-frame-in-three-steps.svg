<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A frame in three steps, and where a change enters</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">A change pays for its first step and every step after it, on every frame it changes.</text>
<rect x="24" y="92" width="200" height="118" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="38" y="118" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">Script</text>
<text x="38" y="144" font-size="13.5" fill="#1f2937" text-anchor="start">React commits;</text>
<text x="38" y="164" font-size="13.5" fill="#1f2937" text-anchor="start">a script writes</text>
<text x="38" y="184" font-size="13.5" fill="#1f2937" text-anchor="start">a style</text>
<rect x="252" y="92" width="220" height="118" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="266" y="118" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">1  Style and layout</text>
<text x="266" y="144" font-size="13.5" fill="#1f2937" text-anchor="start">which rules apply;</text>
<text x="266" y="164" font-size="13.5" fill="#1f2937" text-anchor="start">where every box goes</text>
<text x="266" y="184" font-size="13.5" fill="#1f2937" text-anchor="start">and how big it is</text>
<rect x="500" y="92" width="220" height="118" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="514" y="118" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">2  Paint and raster</text>
<text x="514" y="144" font-size="13.5" fill="#1f2937" text-anchor="start">draw the boxes into</text>
<text x="514" y="164" font-size="13.5" fill="#1f2937" text-anchor="start">the bitmap of the layer</text>
<text x="514" y="184" font-size="13.5" fill="#1f2937" text-anchor="start">they belong to</text>
<rect x="748" y="92" width="208" height="118" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="762" y="118" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">3  Composite</text>
<text x="762" y="144" font-size="13.5" fill="#1f2937" text-anchor="start">the GPU stacks the</text>
<text x="762" y="164" font-size="13.5" fill="#1f2937" text-anchor="start">layers&#x27; bitmaps on</text>
<text x="762" y="184" font-size="13.5" fill="#1f2937" text-anchor="start">the screen</text>
<path d="M226,151 L250,151" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M474,151 L498,151" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M722,151 L746,151" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="24" y="252" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">What one frame of a move costs, by what the move changes</text>
<text x="24" y="282" font-size="13.5" fill="#374151" text-anchor="start">A layout property, or an SVG attribute (the jar tipping by its group&#x27;s transform attribute, before §8.4)</text>
<rect x="252" y="292" width="704" height="30" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="264" y="312" font-size="13.5" fill="#111827" text-anchor="start">layout + paint + raster + composite, every frame</text>
<text x="24" y="354" font-size="13.5" fill="#374151" text-anchor="start">A CSS transform written from script, no layer of its own (a puppet&#x27;s rise before 2026-10-15)</text>
<rect x="500" y="364" width="456" height="30" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="512" y="384" font-size="13.5" fill="#111827" text-anchor="start">paint + raster of its rectangle + composite</text>
<text x="24" y="426" font-size="13.5" fill="#374151" text-anchor="start">transform or opacity on an element with a layer of its own (the rise with will-change, lesson 40)</text>
<rect x="748" y="436" width="208" height="30" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="760" y="456" font-size="13.5" fill="#111827" text-anchor="start">composite only</text>
<rect x="24" y="494" width="932" height="88" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="522" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">A frame has about 16.7 ms at 60 Hz; work that does not fit drops frames.</text>
<text x="44" y="548" font-size="14.5" fill="#1f2937" text-anchor="start">Lesson 40 (emulated phone at 3x, CPU 4x slower, 2026-10-15): with the rise on a layer, raster per</text>
<text x="44" y="571" font-size="14.5" fill="#1f2937" text-anchor="start">speech fell from about 1.5 s to 0.3 s and the long frames from 4 to 1.</text>
</svg>