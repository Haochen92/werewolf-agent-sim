<text x="44" y="476" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">What was measured, and what was not</text>
<text x="44" y="502" font-size="14.5" fill="#1f2937" text-anchor="start">Chromium in the phone frame, CPU 4x slower, production builds, 2026-10-02, each beat under a trace:</text>
<text x="44" y="525" font-size="14.5" fill="#1f2937" text-anchor="start">the table down: paint records 88 -&gt; 22, paint 126 -&gt; 34 ms, raster 1,782 -&gt; 1,837 ms;</text>
<text x="44" y="548" font-size="14.5" fill="#1f2937" text-anchor="start">voting opens: paint records 81 -&gt; 32; the vote over 15 steps: raster 10,489 -&gt; 10,341 ms.</text>
<text x="44" y="571" font-size="14.5" fill="#1f2937" text-anchor="start">Chromium rasters in tiles, so the smaller box showed mostly as fewer paint records, not less raster.</text>
<text x="44" y="594" font-size="14.5" fill="#1f2937" text-anchor="start">The phone&#x27;s own reading of the box was never recorded.</text>
