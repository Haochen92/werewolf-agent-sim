<text x="516" y="393.5" font-size="13.5" fill="#14532d" text-anchor="start">Invalidated each frame: about 630-1290 x 30-890</text>
<text x="516" y="413.5" font-size="13.5" fill="#14532d" text-anchor="start">units; the wing (x &lt; 192) is outside it.</text>
