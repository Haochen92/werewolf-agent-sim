<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A &lt;button&gt; as the box whose layout matters</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">A tappable seat card, iPadOS 18 Safari, 2026-10-17; the iPhone and the desktop drew it whole</text>
<text x="30" y="96" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">To 2026-10-17</text>
<text x="360" y="96" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">2026-10-17 (ea1c3176)</text>
<text x="690" y="96" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">Since 2026-10-19 (9ebb31c2)</text>
<rect x="30" y="120" width="280" height="250" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="40" y="140" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#c2410c" text-anchor="start">&lt;button class=&quot;tile tap&quot;&gt;</text>
<text x="40" y="158" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#c2410c" text-anchor="start">display: flex; column</text>
<rect x="80" y="170" width="180" height="22" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="170.0" y="186" font-size="12" fill="#1f2937" text-anchor="middle">num tag: &#x27;3&#x27;</text>
<rect x="46" y="200" width="2" height="100" fill="#b91c1c"/>
<text x="56" y="245" font-size="12.5" fill="#b91c1c" text-anchor="start">photo: 0 px wide</text>
<text x="56" y="263" font-size="12" fill="#b91c1c" text-anchor="start">(its img is absolute)</text>
<rect x="46" y="308" width="2" height="44" fill="#b91c1c"/>
<text x="56" y="327" font-size="12.5" fill="#b91c1c" text-anchor="start">ruled foot: 0 px wide</text>
<text x="56" y="345" font-size="12" fill="#b91c1c" text-anchor="start">(no text in it)</text>
<text x="30" y="410.0" font-size="13.5" fill="#374151" text-anchor="start">The button was the flex column.</text>
<text x="30" y="429.575" font-size="13.5" fill="#374151" text-anchor="start">Boxes with no in-flow content</text>
<text x="30" y="449.15" font-size="13.5" fill="#374151" text-anchor="start">got their width only from the</text>
<text x="30" y="468.725" font-size="13.5" fill="#374151" text-anchor="start">column&#x27;s stretch, and fell to zero.</text>
<rect x="360" y="120" width="280" height="250" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="370" y="140" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c2410c" text-anchor="start">&lt;button class=tap&gt; display: block</text>
<rect x="372" y="150" width="256" height="212" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="380" y="166" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">.tile, absolute, inset: 0</text>
<rect x="418" y="172" width="164" height="22" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="500.0" y="188" font-size="12" fill="#1f2937" text-anchor="middle">num tag: &#x27;3&#x27;</text>
<rect x="384" y="202" width="232" height="100" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="500.0" y="257" font-size="12.5" fill="#1f2937" text-anchor="middle">photo</text>
<rect x="384" y="310" width="232" height="44" rx="2" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="500.0" y="337" font-size="12.5" fill="#1f2937" text-anchor="middle">ruled foot</text>
<text x="360" y="410.0" font-size="13.5" fill="#374151" text-anchor="start">The button only holds the card;</text>
<text x="360" y="429.575" font-size="13.5" fill="#374151" text-anchor="start">the card fills it by absolute</text>
<text x="360" y="449.15" font-size="13.5" fill="#374151" text-anchor="start">placement, and the rail&#x27;s grid</text>
<text x="360" y="468.725" font-size="13.5" fill="#374151" text-anchor="start">sizes the button.</text>
<rect x="690" y="120" width="280" height="250" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="700" y="140" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">&lt;div class=tap&gt;</text>
<rect x="702" y="150" width="256" height="212" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="710" y="166" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">&lt;span class=tile&gt;, inset: 0</text>
<rect x="748" y="172" width="164" height="22" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="830.0" y="188" font-size="12" fill="#1f2937" text-anchor="middle">num tag: &#x27;3&#x27;</text>
<rect x="714" y="202" width="232" height="100" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="830.0" y="257" font-size="12.5" fill="#1f2937" text-anchor="middle">photo</text>
<rect x="714" y="310" width="232" height="44" rx="2" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="830.0" y="337" font-size="12.5" fill="#1f2937" text-anchor="middle">ruled foot</text>
<rect x="696" y="146" width="268" height="220" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" rx="5"/>
<text x="690" y="410.0" font-size="13.5" fill="#374151" text-anchor="start">A plain div holds the card; an empty,</text>
<text x="690" y="429.575" font-size="13.5" fill="#374151" text-anchor="start">transparent &lt;button class=activation&gt;</text>
<text x="690" y="449.15" font-size="13.5" fill="#374151" text-anchor="start">lies over it at z-index 3. No button</text>
<text x="690" y="468.725" font-size="13.5" fill="#374151" text-anchor="start">is in the card&#x27;s layout at all.</text>
<text x="24" y="540" font-size="13.5" fill="#374151" text-anchor="start">Only the cards made tappable broke (the guide&#x27;s, and every card Reveal opens); the plain cards kept their photos.</text>
<text x="24" y="562" font-size="13.5" fill="#374151" text-anchor="start">Proven on the owner&#x27;s iPad with a test page of variants; headless WebKit did not reproduce it.</text>
</svg>