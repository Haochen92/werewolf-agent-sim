<rect width="980" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A grid row kept a height from before its content measured itself</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">The guide&#x27;s tools tray, 2026-10-22: tabs, then the cards&#x27; stack</text>
