<text x="394" y="290" font-size="12" fill="#1d4ed8" text-anchor="end">row 2: sized</text>
<text x="394" y="306" font-size="12" fill="#1d4ed8" text-anchor="end">before the crop</text>
<rect x="64" y="180" width="220" height="285" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="74" y="204" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">the seat card</text>
<rect x="74" y="216" width="200" height="150" rx="2" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="84" y="240.0" font-size="12.5" fill="#1f2937" text-anchor="start">the demo: a container</text>
<text x="84" y="258.125" font-size="12.5" fill="#1f2937" text-anchor="start">query and an</text>
<text x="84" y="276.25" font-size="12.5" fill="#1f2937" text-anchor="start">aspect-ratio box,</text>
<text x="84" y="294.375" font-size="12.5" fill="#1f2937" text-anchor="start">sized later</text>
<rect x="64" y="430" width="220" height="35" fill="#fee2e2" stroke="#b91c1c" stroke-dasharray="5 4"/>
<text x="294" y="452" font-size="12.5" fill="#b91c1c" text-anchor="start">past the rim</text>
