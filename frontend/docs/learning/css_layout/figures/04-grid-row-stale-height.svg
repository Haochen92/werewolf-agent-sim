<text x="40" y="520" font-size="13.5" fill="#b91c1c" text-anchor="start">makes the browser lay it out again</text>
<text x="40" y="90" font-size="13.5" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2937" text-anchor="start">display: grid (to 2026-10-22)</text>
