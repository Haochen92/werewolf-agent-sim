<text x="540" y="560" font-size="13.5" fill="#15803d" text-anchor="start">no row to remember a height: the tray is its items</text>
<text x="540" y="580" font-size="13.5" fill="#15803d" text-anchor="start">and gaps, laid out again whenever one changes</text>
<text x="540" y="90" font-size="13.5" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2937" text-anchor="start">display: flex; flex-direction: column</text>
