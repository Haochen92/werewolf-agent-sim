<rect x="564" y="126" width="330" height="34" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="574" y="148" font-size="12.5" fill="#1f2937" text-anchor="start">tabs: Seat cards · Your agent · Your card</text>
<rect x="564" y="174" width="220" height="250" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="574" y="198" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">the seat card</text>
<rect x="574" y="210" width="200" height="150" rx="2" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="584" y="234.0" font-size="12.5" fill="#1f2937" text-anchor="start">the demo, sized</text>
