<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="540" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A size measured after mount: the first render&#x27;s guess fetches</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">The stage learns it is phone-small in a layout effect (Stage.tsx). A phone, the carriage&#x27;s first window.</text>
<text x="24" y="108" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Before: the scene drew once with small = false</text>
<rect x="24" y="124" width="214" height="64" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="36" y="149" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">render 1</text>
<text x="36" y="171" font-size="12.5" fill="#374151" text-anchor="start">small: false (a guess)</text>
<rect x="258" y="124" width="214" height="64" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="270" y="149" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">scene draws as desktop</text>
<text x="270" y="171" font-size="12.5" fill="#374151" text-anchor="start">puppet &lt;img&gt;, DecodeAhead</text>
<rect x="492" y="124" width="214" height="64" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="504" y="149" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">layout effect</text>
<text x="504" y="171" font-size="12.5" fill="#374151" text-anchor="start">measures: small = true</text>
<rect x="726" y="124" width="230" height="64" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="738" y="149" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">render 2</text>
<text x="738" y="171" font-size="12.5" fill="#374151" text-anchor="start">the @small poses</text>
<path d="M240,156 L256,156" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M474,156 L490,156" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M708,156 L724,156" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="258" y="206" width="480" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="272" y="231" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#7f1d1d" text-anchor="start">fetched at once: talking.webp + thinking.webp, full size</text>
<text x="24" y="272" font-size="14" fill="#7f1d1d" text-anchor="start">Every phone fetched both sizes: 235 KB of full-size poses beside their @small copies.</text>
<text x="24" y="324" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">After (fec8cf40): the Stage renders its scene only once it has measured itself</text>
<rect x="24" y="340" width="214" height="64" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="36" y="365" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">render 1</text>
<text x="36" y="387" font-size="12.5" fill="#374151" text-anchor="start">layers only; no scene</text>
<rect x="258" y="340" width="214" height="64" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="270" y="365" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">layout effect</text>
<text x="270" y="387" font-size="12.5" fill="#374151" text-anchor="start">measure, setMeasured</text>
<rect x="492" y="340" width="214" height="64" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="504" y="365" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">render 2, before paint</text>
<text x="504" y="387" font-size="12.5" fill="#374151" text-anchor="start">scene draws as a phone</text>
<rect x="726" y="340" width="230" height="64" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="738" y="365" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">first paint</text>
<text x="738" y="387" font-size="12.5" fill="#374151" text-anchor="start">only @small fetched</text>
<path d="M240,372 L256,372" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M474,372 L490,372" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M708,372 L724,372" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="24" y="434" font-size="13" fill="#14532d" text-anchor="start">{measured ? children : null}: one extra render, still before the first paint, so nothing is seen twice.</text>
<rect x="24" y="452" width="932" height="70" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="480" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The rule</text>
<text x="44" y="506" font-size="14.5" fill="#1f2937" text-anchor="start">A value that picks which file to fetch must be known before the first render that uses it.</text>
</svg>