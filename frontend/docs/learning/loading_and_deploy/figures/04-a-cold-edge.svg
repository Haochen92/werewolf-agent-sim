<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="560" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A deploy empties the edge of every file it renamed</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">Next names files by their content, so a changed file gets a new name that no Cloudflare location has seen.</text>
<rect x="24" y="84" width="932" height="92" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="44" y="110" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">The 14:28 deploy, 2026-10-15</text>
<rect x="44" y="124" width="250" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="169.0" y="144.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">train@1x.&lt;old hash&gt;.webp</text>
<path d="M300,139 L340,139" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="346" y="124" width="240" height="30" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="466.0" y="144.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">train@1x.b57accb5.webp</text>
<text x="604" y="144" font-size="13.5" fill="#1f2937" text-anchor="start">a new name: at every location, a MISS</text>
<text x="44" y="208" font-size="14.5" font-weight="bold" fill="#111827" text-anchor="start">The first visitor at a location after the deploy</text>
<rect x="44" y="222" width="420" height="40" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="58" y="247" font-size="13.5" fill="#1f2937" text-anchor="start">browser -&gt; edge (SIN): MISS</text>
<text x="484" y="247" font-size="13" fill="#374151" text-anchor="start">the edge has never seen the name</text>
<rect x="44" y="270" width="420" height="40" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="58" y="295" font-size="13.5" fill="#1f2937" text-anchor="start">edge -&gt; Caddy -&gt; Next, the whole way</text>
<text x="484" y="295" font-size="13" fill="#374151" text-anchor="start">one full round trip per renamed file</text>
<text x="44" y="338" font-size="14.5" font-weight="bold" fill="#111827" text-anchor="start">Everyone after them at that location</text>
<rect x="44" y="352" width="420" height="40" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="58" y="377" font-size="13.5" fill="#1f2937" text-anchor="start">browser -&gt; edge (SIN): HIT, with an age header</text>
<text x="484" y="377" font-size="13" fill="#374151" text-anchor="start">served from nearby</text>
<rect x="24" y="420" width="932" height="126" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44" y="448" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Measured, and what is not proven</text>
<text x="44" y="474" font-size="14.5" fill="#1f2937" text-anchor="start">Throttled desktop on the server&#x27;s own machine (10 Mbps, 100 ms, 3x CPU, cache off): load event</text>
<text x="44" y="497" font-size="14.5" fill="#1f2937" text-anchor="start">12.9 s in the first run after the deploy, 1.6 to 2.1 s in three runs later. Probable cause: a cold edge.</text>
<text x="44" y="520" font-size="14.5" fill="#1f2937" text-anchor="start">Not proven: the owner&#x27;s own slow visit was not timed. Read cf-cache-status on the next first visit.</text>
</svg>