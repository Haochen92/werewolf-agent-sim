<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A loading boundary splits hydration in two</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">The rooms page under (site)/loading.tsx, 2026-10-16. The nav and the departures board share one request.</text>
<rect x="40" y="84" width="220" height="36" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="150" y="108" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">shell (the nav)</text>
<line x1="150" y1="120" x2="150" y2="430" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="380" y="84" width="220" height="36" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="490" y="108" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">network</text>
<line x1="490" y1="120" x2="490" y2="430" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="720" y="84" width="220" height="36" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="830" y="108" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">page inside the boundary</text>
<line x1="830" y1="120" x2="830" y2="430" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="24" y="132" width="932" height="34" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="490" y="155" font-size="13.5" fill="#1f2937" text-anchor="middle">server HTML arrives: the board drawn pending (its rows a placeholder)</text>
<rect x="50" y="182" width="200" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="150" y="205" font-size="13.5" fill="#1f2937" text-anchor="middle">1. the shell hydrates</text>
<path d="M250,200 L488,200" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="370" y="194" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">GET /rooms</text>
<path d="M490,246 L828,246" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#r)"/>
<text x="660" y="240" font-size="12.5" fill="#b91c1c" text-anchor="middle">2. the answer comes (quick: the tests&#x27; mocks)</text>
<rect x="706" y="266" width="248" height="54" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="830" y="288" font-size="13.5" fill="#1f2937" text-anchor="middle">3. the board hydrates, reads</text>
<text x="830" y="308" font-size="13.5" fill="#1f2937" text-anchor="middle">the cached list: three rows</text>
<rect x="586" y="336" width="368" height="70" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="770" y="360" font-size="13" fill="#1f2937" text-anchor="middle">three rows against the server&#x27;s pending face:</text>
<text x="770" y="380" font-size="13" fill="#1f2937" text-anchor="middle">&quot;Hydration failed&quot;; React draws the board again</text>
<text x="770" y="398" font-size="12.5" fill="#7f1d1d" text-anchor="middle">(seen only as the dev overlay&#x27;s &quot;1 Issue&quot;)</text>
<rect x="24" y="444" width="932" height="140" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="472" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The fix: useHydrated (hooks/useHydrated.ts)</text>
<text x="44" y="498" font-size="14.5" fill="#1f2937" text-anchor="start">useSyncExternalStore returns its server snapshot (false) while React hydrates, the client one (true) after.</text>
<text x="44" y="521" font-size="14.5" fill="#1f2937" text-anchor="start">The board and useBoarding treat the list as pending until then, so the board hydrates as the server drew it,</text>
<text x="44" y="544" font-size="14.5" fill="#1f2937" text-anchor="start">then draws its rows in an ordinary render. Without the boundary the whole page hydrated in one pass,</text>
<text x="44" y="567" font-size="14.5" fill="#1f2937" text-anchor="start">before any answer could come, so the mismatch could not happen.</text>
</svg>