<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="470" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">One batch, measured before and after on production builds</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">fbaef8c (before) against a3d6404 (after), 2026-10-02. Chromium in the phone frame, CPU 4x,</text>
<text x="24" y="82" font-size="14" fill="#4b5563" text-anchor="start">every beat stepped under a trace, raster ms summed over the scene; how many walks, not recorded.</text>
<text x="178" y="136" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="end">The vote, 41 steps</text>
<rect x="190" y="120" width="600.0" height="22" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="798.0" y="136" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">67,480 ms before</text>
<rect x="190" y="146" width="205.07409602845286" height="22" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="403.07409602845286" y="162" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">23,064 ms after</text>
<text x="178" y="212" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="end">The lynch, 11 steps</text>
<rect x="190" y="196" width="193.1416716064019" height="22" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="391.1416716064019" y="212" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">21,722 ms before</text>
<rect x="190" y="222" width="96.04623592175459" height="22" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="294.0462359217546" y="238" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">10,802 ms after</text>
<text x="178" y="288" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="end">The day, 7 steps</text>
<rect x="190" y="272" width="134.94665085951394" height="22" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="332.94665085951397" y="288" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">15,177 ms before</text>
<rect x="190" y="298" width="89.14641375222288" height="22" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="287.1464137522229" y="314" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">10,026 ms after</text>
<rect x="24" y="358" width="932" height="90" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="386" font-size="13.5" fill="#1f2937" text-anchor="start">The batch shipped eight changes together (the car&#x27;s host, stepped moves, the light boxed, phone copies,</text>
<text x="44" y="408" font-size="13.5" fill="#1f2937" text-anchor="start">decode-ahead; from the audit, the grain, the night choice, the light&#x27;s cache), so these are the batch&#x27;s</text>
<text x="44" y="430" font-size="13.5" fill="#1f2937" text-anchor="start">numbers and no single change owns them. A counted chip: 1.0 to 1.8 s of raster before, 0.34 to 0.49 s after.</text>
</svg>