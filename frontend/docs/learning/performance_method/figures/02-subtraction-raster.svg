<text x="44" y="508" font-size="13.5" fill="#1f2937" text-anchor="start">Each layer hidden alone takes off a few hundred ms; both together take off the most. So the light and the</text>
<text x="44" y="530" font-size="13.5" fill="#1f2937" text-anchor="start">grade both cost raster under a mover, and neither alone is the whole answer. Hiding is CSS only: the</text>
<text x="44" y="552" font-size="13.5" fill="#1f2937" text-anchor="start">React render and the light&#x27;s geometry still run. Headless Chromium, CPU 4x, software graphics: not an iPhone.</text>
