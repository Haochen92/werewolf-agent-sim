<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="640" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">One fix per crash, against census, one batch, a gate</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">build_log 8.3 to 8.7, 2026-10-01 to 10-02. The owner&#x27;s rule of 2026-10-02.</text>
<text x="24" y="100" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="start">Four rounds: each report found one more instance of one rule</text>
<rect x="24" y="116" width="210" height="74" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="38" y="140" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">§8.3  the felt window</text>
<text x="38" y="164" font-size="13.5" fill="#1f2937" text-anchor="start">animating at rest</text>
<text x="38" y="182" font-size="12" fill="#6b7280" text-anchor="start">report, hunt, fix, deploy</text>
<path d="M236,153 L262,153" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="264" y="116" width="210" height="74" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="278" y="140" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">§8.4  jar and shutter</text>
<text x="278" y="164" font-size="13.5" fill="#1f2937" text-anchor="start">an SVG attribute move</text>
<text x="278" y="182" font-size="12" fill="#6b7280" text-anchor="start">report, hunt, fix, deploy</text>
<path d="M476,153 L502,153" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="504" y="116" width="210" height="74" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="518" y="140" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">§8.5  the camera&#x27;s move</text>
<text x="518" y="164" font-size="13.5" fill="#1f2937" text-anchor="start">a full-stage repaint</text>
<text x="518" y="182" font-size="12" fill="#6b7280" text-anchor="start">report, hunt, fix, deploy</text>
<path d="M716,153 L742,153" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="744" y="116" width="210" height="74" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="758" y="140" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">§8.6  three idle things</text>
<text x="758" y="164" font-size="13.5" fill="#1f2937" text-anchor="start">a layer each, at rest</text>
<text x="758" y="182" font-size="12" fill="#6b7280" text-anchor="start">report, hunt, fix, deploy</text>
<text x="24" y="222" font-size="13.5" fill="#4b5563" text-anchor="start">Each round cost a deploy and a session on the owner&#x27;s phone.</text>
<text x="24" y="268" font-size="15" font-weight="bold" fill="#15803d" text-anchor="start">Then: list the whole class, fix the list together, keep it closed with a test</text>
<rect x="24" y="286" width="300" height="250" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="44" y="314" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">1. Census</text>
<text x="44" y="340" font-size="13" fill="#1f2937" text-anchor="start">Grep the stage&#x27;s CSS for what</text>
<text x="44" y="360" font-size="13" fill="#1f2937" text-anchor="start">makes a layer: animation:,</text>
<text x="44" y="380" font-size="13" fill="#1f2937" text-anchor="start">will-change, filter, blend, mask,</text>
<text x="44" y="400" font-size="13" fill="#1f2937" text-anchor="start">scrollers. The sweep&#x27;s list:</text>
<text x="44" y="420" font-size="13" fill="#1f2937" text-anchor="start">• the kit&#x27;s idle snow, sway, flicker</text>
<text x="44" y="440" font-size="13" fill="#1f2937" text-anchor="start">• the lift&#x27;s will-change, 4 to 6 s</text>
<text x="44" y="460" font-size="13" fill="#1f2937" text-anchor="start">• the station train&#x27;s will-change</text>
<text x="44" y="480" font-size="13" fill="#1f2937" text-anchor="start">• the ledger fading in</text>
<text x="44" y="500" font-size="13" fill="#1f2937" text-anchor="start">• two answers to &quot;is this a phone?&quot;</text>
<path d="M326,410 L352,410" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="354" y="286" width="270" height="250" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="374" y="314" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">2. One batch</text>
<text x="374" y="340" font-size="13" fill="#1f2937" text-anchor="start">Every item fixed in one pass:</text>
<text x="374" y="360" font-size="13" fill="#1f2937" text-anchor="start">on a phone each stands still,</text>
<text x="374" y="380" font-size="13" fill="#1f2937" text-anchor="start">arrives at once, or keeps no</text>
<text x="374" y="400" font-size="13" fill="#1f2937" text-anchor="start">layer. One flag for a phone:</text>
<text x="374" y="420" font-size="13" fill="#1f2937" text-anchor="start">useSmall(), the Stage&#x27;s own</text>
<text x="374" y="440" font-size="13" fill="#1f2937" text-anchor="start">measure, as data-small is.</text>
<text x="374" y="460" font-size="13" fill="#1f2937" text-anchor="start"></text>
<text x="374" y="480" font-size="13" fill="#1f2937" text-anchor="start">One deploy, one reading on</text>
<text x="374" y="500" font-size="13" fill="#1f2937" text-anchor="start">the device.</text>
<path d="M626,410 L652,410" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="654" y="286" width="302" height="250" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="674" y="314" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">3. A gate</text>
<text x="674" y="340" font-size="13" fill="#1f2937" text-anchor="start">e2e/phone-rule.spec.ts walks every</text>
<text x="674" y="360" font-size="13" fill="#1f2937" text-anchor="start">scene and beat (about 300) in the</text>
<text x="674" y="380" font-size="13" fill="#1f2937" text-anchor="start">phone frame and fails:</text>
<text x="674" y="400" font-size="13" fill="#1f2937" text-anchor="start">• an animation at rest</text>
<text x="674" y="420" font-size="13" fill="#1f2937" text-anchor="start">• will-change outside the world</text>
<text x="674" y="440" font-size="13" fill="#1f2937" text-anchor="start">• a large mask or a large mover</text>
<text x="674" y="460" font-size="13" fill="#1f2937" text-anchor="start">• a beat that rebuilds the set</text>
<text x="674" y="480" font-size="13" fill="#1f2937" text-anchor="start">No CI: it holds only when run.</text>
<text x="24" y="574" font-size="13.5" fill="#4b5563" text-anchor="start">The gate&#x27;s own blind spot (it first read only what still ran at the window&#x27;s end) is lesson 18, in testing.</text>
<text x="24" y="600" font-size="13.5" fill="#4b5563" text-anchor="start">A new instance of the class now fails a test instead of crashing a phone, provided someone runs it.</text>
</svg>