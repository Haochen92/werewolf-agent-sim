<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="520" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">One measurement decides &quot;a phone&quot;</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">the workbench&#x27;s iPhone 14 frame (844 x 390) inside a desktop window, before and after 2026-10-02</text>
<rect x="30" y="90" width="440" height="400" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="50" y="118" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Before: two questions, two answers</text>
<rect x="50" y="140" width="400" height="120" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="66" y="164" font-size="14" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2937" text-anchor="start">useNarrow (screen.ts)</text>
<text x="66" y="188" font-size="13.5" fill="#1f2937" text-anchor="start">the window under 1000 css px?</text>
<text x="66" y="209" font-size="13.5" fill="#1f2937" text-anchor="start">a desktop window, say 1280: no</text>
<text x="66" y="230" font-size="13.5" fill="#1f2937" text-anchor="start">the backdrop crossfades at night fall</text>
<rect x="50" y="278" width="400" height="120" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="66" y="302" font-size="14" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2937" text-anchor="start">data-small (the css rules)</text>
<text x="66" y="326" font-size="13.5" fill="#1f2937" text-anchor="start">the stage under 3/4 of 1600?</text>
<text x="66" y="347" font-size="13.5" fill="#1f2937" text-anchor="start">stage 693 px wide, 0.43: yes, a phone</text>
<text x="66" y="368" font-size="13.5" fill="#1f2937" text-anchor="start">camera, grain, glows: the phone&#x27;s</text>
<text x="50" y="428" font-size="13.5" fill="#c2410c" text-anchor="start">The gate&#x27;s phone frame saw the desktop&#x27;s</text>
<text x="50" y="449" font-size="13.5" fill="#c2410c" text-anchor="start">crossfade: it was not testing what a phone draws.</text>
<rect x="510" y="90" width="440" height="400" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="530" y="118" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">After: one measurement, two outlets</text>
<rect x="530" y="140" width="400" height="74" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="546" y="164" font-size="14" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2937" text-anchor="start">Stage.tsx layout effect</text>
<text x="546" y="188" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">sm = width / 1600 &lt; 0.75  (693 / 1600 = 0.43)</text>
<path d="M630,214 L630,262" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M830,214 L830,262" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="530" y="264" width="195" height="150" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="544" y="288" font-size="14" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2937" text-anchor="start">data-small</text>
<text x="544" y="312" font-size="13.5" fill="#1f2937" text-anchor="start">attribute on the box</text>
<text x="544" y="333" font-size="13.5" fill="#1f2937" text-anchor="start">css rules; the camera</text>
<text x="544" y="354" font-size="13.5" fill="#1f2937" text-anchor="start">reads it to cut</text>
<rect x="735" y="264" width="195" height="150" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="749" y="288" font-size="14" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#1f2937" text-anchor="start">useSmall()</text>
<text x="749" y="312" font-size="13.5" fill="#1f2937" text-anchor="start">SmallContext (set.ts)</text>
<text x="749" y="333" font-size="13.5" fill="#1f2937" text-anchor="start">useSteps, the ending,</text>
<text x="749" y="354" font-size="13.5" fill="#1f2937" text-anchor="start">the phone&#x27;s sprites</text>
<text x="530" y="446" font-size="13.5" fill="#1f2937" text-anchor="start">A desktop window that draws the stage under</text>
<text x="530" y="467" font-size="13.5" fill="#1f2937" text-anchor="start">1200 css px wide counts as small too.</text>
</svg>