<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="570" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">Who drops behind the stand as voting opens</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">a day that ends in a run of passes (beatsFor.test.ts, &#x27;the vote opens on the seat last at the stand&#x27;)</text>
<text x="30" y="120" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">Replay beats</text>
<rect x="200" y="100" width="110" height="34" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="255.0" y="122.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">speech 1</text>
<rect x="328" y="100" width="190" height="34" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="423.0" y="122.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">pass 2, 4 (one beat)</text>
<rect x="536" y="100" width="120" height="34" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="596.0" y="122.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">vote.opens</text>
<path d="M596.0,134 Q557.0,180 423.0,134" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="463.0" y="184" font-size="13" font-family="Menlo, Consolas, monospace" fill="#15803d" text-anchor="start">atStand(previous beat): a notice, so nobody</text>
<rect x="680" y="94" width="290" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="694" y="122" font-size="13.5" fill="#15803d" text-anchor="start">stand: undefined, the stand empty</text>
<text x="30" y="240" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">X-ray beats</text>
<rect x="200" y="220" width="110" height="34" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="255.0" y="242.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">speech 1</text>
<rect x="328" y="220" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="373.0" y="242.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">pass 2</text>
<rect x="436" y="220" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="481.0" y="242.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">pass 4</text>
<rect x="544" y="220" width="120" height="34" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="604.0" y="242.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">vote.opens</text>
<path d="M604.0,254 Q545.0,298 481.0,254" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="501.0" y="304" font-size="13" font-family="Menlo, Consolas, monospace" fill="#15803d" text-anchor="start">a lone pass has a subject: seat 4</text>
<rect x="680" y="214" width="290" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="694" y="242" font-size="13.5" fill="#15803d" text-anchor="start">stand: player_4, who stood there</text>
<rect x="30" y="340" width="940" height="206" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="50" y="368" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">Before 2026-10-15: the vote scene took the seat from the folded log&#x27;s last turn</text>
<text x="50" y="396" font-size="14" fill="#1f2937" text-anchor="start">Replay: the log&#x27;s last turn is seat 4&#x27;s pass, but the stage showed the run as one notice with the</text>
<text x="50" y="418" font-size="14" fill="#1f2937" text-anchor="start">stand empty. Seat 4&#x27;s puppet, never on the stage, flashed up for half a second as the table rose.</text>
<text x="50" y="440" font-size="14" fill="#1f2937" text-anchor="start">Live: a seat never receives the pass markers (observer tier), so the log&#x27;s last turn could be</text>
<text x="50" y="462" font-size="14" fill="#1f2937" text-anchor="start">a speaker from several turns earlier.</text>
<text x="50" y="484" font-size="14" fill="#1f2937" text-anchor="start"></text>
<text x="50" y="506" font-size="14" fill="#1f2937" text-anchor="start">The fix: the cutter is the only code that knows what this viewer was shown, so it stamps</text>
<text x="50" y="528" font-size="14" fill="#1f2937" text-anchor="start">vote.opens with stand: atStand(out.at(-1)), and VoteScene drops beat.stand.</text>
</svg>