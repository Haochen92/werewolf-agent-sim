<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A cache key holds what the drawing depends on, never the instance</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">Lessons 12 and 36. Stage.tsx::Paint draws the house light; tracing its holes takes 60 to 110 ms on a phone.</text>
<text x="24" y="104" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="start">the dining car&#x27;s light</text>
<rect x="200" y="86" width="210" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="305.0" y="108.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">instance 1: paint id pr1</text>
<text x="495" y="126" font-size="12.5" fill="#4b5563" text-anchor="middle">a night: the car unmounts</text>
<path d="M415,103 L575,103" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="6 4"/>
<rect x="580" y="86" width="210" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="685.0" y="108.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">instance 2: paint id pr7</text>
<text x="800" y="100" font-size="12" fill="#4b5563" text-anchor="start">same options,</text>
<text x="800" y="115" font-size="12" fill="#4b5563" text-anchor="start">new id</text>
<text x="24" y="140" font-size="12" fill="#4b5563" text-anchor="start">(stand-in ids: each instance gets its own from useId)</text>
<rect x="24" y="160" width="452" height="250" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="44" y="190" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">Before: the key held the instance</text>
<text x="44" y="220" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">key = id + &#x27;\0&#x27; + JSON.stringify(opts)</text>
<rect x="44" y="236" width="412" height="34" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="250.0" y="258.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">pr1 + {pool, dark, ...}</text>
<text x="250" y="290" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">lookup with pr7 + {pool, dark, ...}</text>
<rect x="44" y="302" width="412" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="250.0" y="324.0" font-size="13.5" fill="#1f2937" text-anchor="middle">miss: trace the holes again, 60 to 110 ms</text>
<text x="250" y="362" font-size="13" fill="#991b1b" text-anchor="middle">on the morning&#x27;s busiest beat</text>
<text x="250" y="382" font-size="12" fill="#4b5563" text-anchor="middle">(audit 2026-10-11 §3)</text>
<rect x="504" y="160" width="452" height="250" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="524" y="190" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">After (f30d4496): Stage.tsx::drawn</text>
<text x="524" y="220" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">per generator: key = JSON.stringify(opts)</text>
<rect x="524" y="236" width="412" height="34" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="730.0" y="258.0" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">{pool, dark, ...}  drawn with id pPaintIdZq</text>
<text x="730" y="290" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">lookup with {pool, dark, ...}</text>
<rect x="524" y="302" width="412" height="34" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="730.0" y="324.0" font-size="13.5" fill="#1f2937" text-anchor="middle">hit: no tracing</text>
<text x="730" y="362" font-size="13" fill="#14532d" text-anchor="middle">html.replaceAll(ANY_ID, id) writes</text>
<text x="730" y="382" font-size="13" fill="#14532d" text-anchor="middle">each instance&#x27;s own id in on the way out</text>
<rect x="24" y="428" width="932" height="152" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="456" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">What the cache provides, and no more</text>
<text x="44" y="482" font-size="14.5" fill="#1f2937" text-anchor="start">At most 48 drawings per generator (KEEP); the least recently used goes first.</text>
<text x="44" y="505" font-size="14.5" fill="#1f2937" text-anchor="start">A repeat skips only the tracing, only while it is among those 48, only within one page load.</text>
<text x="44" y="528" font-size="14.5" fill="#1f2937" text-anchor="start">Writing the id in and setting the markup are still paid on every hit.</text>
<text x="44" y="551" font-size="14.5" fill="#1f2937" text-anchor="start">The id is a label (two stages on one page must not share a gradient name), not an input.</text>
</svg>