<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="640" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">Re-render or remount: what survives</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">The same instance called again, against a new instance in its place.</text>
<text x="408.0" y="98" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">re-render (the same instance)</text>
<text x="774.0" y="98" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">remount (a new instance)</text>
<text x="24" y="133" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="start">the function</text>
<rect x="232" y="110" width="352" height="32" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="408" y="131" font-size="13" fill="#1f2937" text-anchor="middle">runs again</text>
<rect x="592" y="110" width="364" height="32" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="774" y="131" font-size="13" fill="#1f2937" text-anchor="middle">runs again</text>
<text x="24" y="171" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="start">state</text>
<rect x="232" y="148" width="352" height="32" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="408" y="169" font-size="13" fill="#1f2937" text-anchor="middle">kept</text>
<rect x="592" y="148" width="364" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="774" y="169" font-size="13" fill="#1f2937" text-anchor="middle">starts from its initial value</text>
<text x="24" y="209" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="start">DOM elements</text>
<rect x="232" y="186" width="352" height="32" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="408" y="207" font-size="13" fill="#1f2937" text-anchor="middle">kept; only what differs changes</text>
<rect x="592" y="186" width="364" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="774" y="207" font-size="13" fill="#1f2937" text-anchor="middle">removed; new ones created</text>
<text x="24" y="247" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="start">effects</text>
<rect x="232" y="224" width="352" height="32" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="408" y="245" font-size="13" fill="#1f2937" text-anchor="middle">run again if their deps changed</text>
<rect x="592" y="224" width="364" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="774" y="245" font-size="13" fill="#1f2937" text-anchor="middle">cleaned up, then all run again</text>
<text x="24" y="285" font-size="13.5" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#111827" text-anchor="start">an &lt;img&gt;</text>
<rect x="232" y="262" width="352" height="32" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="408" y="283" font-size="13" fill="#1f2937" text-anchor="middle">the same element, already decoded</text>
<rect x="592" y="262" width="364" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="774" y="283" font-size="13" fill="#1f2937" text-anchor="middle">a new element to load and decode</text>
<text x="24" y="323" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="start">cost</text>
<rect x="232" y="300" width="352" height="32" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="408" y="321" font-size="13" fill="#1f2937" text-anchor="middle">CPU</text>
<rect x="592" y="300" width="364" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="774" y="321" font-size="13" fill="#1f2937" text-anchor="middle">CPU, memory (garbage), the state</text>
<text x="24" y="362" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">The set and beat split (phone lesson 5): DayScene.tsx::DayBody</text>
<rect x="24" y="382" width="160" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="104.0" y="404.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">DayBody</text>
<path d="M44,416 L44,446 L78,446" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="80" y="430" width="260" height="34" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="210.0" y="452.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">&lt;DaySet /&gt;</text>
<text x="350" y="444" font-size="12.5" fill="#14532d" text-anchor="start">re-renders each beat: the car&#x27;s set,</text>
<text x="350" y="460" font-size="12.5" fill="#14532d" text-anchor="start">the light, the wing kept in place</text>
<path d="M44,446 L44,494 L78,494" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="80" y="478" width="260" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="210.0" y="500.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">&lt;DayTurn key={on.key} /&gt;</text>
<text x="350" y="492" font-size="12.5" fill="#991b1b" text-anchor="start">remounts on a new turn (on.key is</text>
<text x="350" y="508" font-size="12.5" fill="#991b1b" text-anchor="start">beat.id:seq): puppet, plate, box</text>
<text x="640" y="398" font-size="13" font-weight="bold" fill="#111827" text-anchor="start">per beat step, the day</text>
<text x="840" y="398" font-size="13" fill="#4b5563" text-anchor="end">before</text>
<text x="940" y="398" font-size="13" fill="#4b5563" text-anchor="end">after</text>
<text x="640" y="426" font-size="13" fill="#1f2937" text-anchor="start">DOM nodes added</text>
<text x="840" y="426" font-size="13" font-family="Menlo, Consolas, monospace" fill="#991b1b" text-anchor="end">343</text>
<text x="940" y="426" font-size="13" font-family="Menlo, Consolas, monospace" fill="#14532d" text-anchor="end">194</text>
<text x="640" y="452" font-size="13" fill="#1f2937" text-anchor="start">pictures</text>
<text x="840" y="452" font-size="13" font-family="Menlo, Consolas, monospace" fill="#991b1b" text-anchor="end">15.1</text>
<text x="940" y="452" font-size="13" font-family="Menlo, Consolas, monospace" fill="#14532d" text-anchor="end">6.0</text>
<text x="640" y="478" font-size="13" fill="#1f2937" text-anchor="start">paint sheets redrawn</text>
<text x="840" y="478" font-size="13" font-family="Menlo, Consolas, monospace" fill="#991b1b" text-anchor="end">2.0</text>
<text x="940" y="478" font-size="13" font-family="Menlo, Consolas, monospace" fill="#14532d" text-anchor="end">0.0</text>
<text x="640" y="512" font-size="12" fill="#4b5563" text-anchor="start">Chromium, 30 steps at 330 ms (build_log §8.3)</text>
<rect x="24" y="540" width="932" height="84" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="568" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Why the phone cared</text>
<text x="44" y="594" font-size="14.5" fill="#1f2937" text-anchor="start">Before the split the page died on the owner&#x27;s iPhone at two to three beats a second. Chromium&#x27;s</text>
<text x="44" y="617" font-size="14.5" fill="#1f2937" text-anchor="start">live nodes went 1,088, then 1,468 mid-run, then 693: transient pressure a desktop hides.</text>
</svg>