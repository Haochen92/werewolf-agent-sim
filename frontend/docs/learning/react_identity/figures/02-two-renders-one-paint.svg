<text x="44" y="524" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The fix in CarScene.tsx: a description travels with the props it was made with</text>
<text x="44" y="550" font-size="14.5" fill="#1f2937" text-anchor="start">interface Described { spec; props }, and CarSetSheet is drawn from described.props.</text>
<text x="44" y="573" font-size="14.5" fill="#1f2937" text-anchor="start">Render 1 was never painted, but its commit still reached the wing: each pass sees only its own state.</text>
