<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">A key names the instance: what one counted chip rebuilt</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">The vote at one beat step, vote.chip-counted. Green: the same instance, kept with its state and elements. Red: thrown away and built again.</text>
<text x="24" y="100" font-size="14" fill="#1f2937" text-anchor="start">React keeps a child when all three match the last render:</text>
<rect x="420" y="81" width="86" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="463.0" y="100.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">position</text>
<rect x="516" y="81" width="86" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="559.0" y="100.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">type</text>
<rect x="612" y="81" width="86" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="655.0" y="100.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">key</text>
<text x="720" y="100" font-size="14" fill="#991b1b" text-anchor="start">any one differs: a new instance</text>
<rect x="24" y="124" width="452" height="380" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="44" y="154" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">Before (lesson 1): the whole scene keyed per beat</text>
<rect x="44" y="176" width="412" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="250.0" y="198.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">&lt;VoteBeat key={`${beat.id}:${beat.seq}`}&gt;</text>
<text x="250" y="230" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#991b1b" text-anchor="middle">key  vote.chip-counted:n  becomes  vote.chip-counted:n+1</text>
<text x="250" y="252" font-size="13" fill="#4b5563" text-anchor="middle">so everything under it is built again:</text>
<path d="M70,262 L70,449" stroke="#374151" stroke-width="1.4" fill="none"/>
<path d="M70,281 L94,281" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M70,323 L94,323" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M70,365 L94,365" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M70,407 L94,407" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M70,449 L94,449" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="96" y="266" width="340" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="266.0" y="286.0" font-size="13.5" fill="#1f2937" text-anchor="middle">the car&#x27;s picture (backdrop)</text>
<rect x="96" y="308" width="340" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="266.0" y="328.0" font-size="13.5" fill="#1f2937" text-anchor="middle">the shutter</text>
<rect x="96" y="350" width="340" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="266.0" y="370.0" font-size="13.5" fill="#1f2937" text-anchor="middle">the house light (traced again)</text>
<rect x="96" y="392" width="340" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="266.0" y="412.0" font-size="13.5" fill="#1f2937" text-anchor="middle">the wing: nine heads</text>
<rect x="96" y="434" width="340" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="266.0" y="454.0" font-size="13.5" fill="#1f2937" text-anchor="middle">the table and the ballot line</text>
<text x="250" y="488" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">385 of 388 elements replaced (rendering audit §2)</text>
<rect x="504" y="124" width="452" height="380" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="524" y="154" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">Now: only the smallest part is keyed</text>
<rect x="524" y="176" width="260" height="34" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="654.0" y="198.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">CarScene  (the host)</text>
<text x="794" y="198" font-size="12" fill="#14532d" text-anchor="start">same spot, same type</text>
<path d="M544,210 L544,293" stroke="#374151" stroke-width="1.4" fill="none"/>
<path d="M544,243 L570,243" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M544,293 L570,293" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="572" y="226" width="230" height="34" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="687.0" y="248.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">CarSetSheet</text>
<text x="812" y="240" font-size="12" fill="#14532d" text-anchor="start">backdrop, shutter,</text>
<text x="812" y="255" font-size="12" fill="#14532d" text-anchor="start">light, wing: in place</text>
<rect x="572" y="276" width="230" height="34" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="687.0" y="298.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">VoteBody  (memo)</text>
<path d="M592,310 L592,342 L618,342" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="620" y="326" width="316" height="34" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="778.0" y="348.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">VoteBeat key={`${me}:${chosen}`}</text>
<text x="778" y="378" font-size="12" fill="#14532d" text-anchor="middle">viewer and their choice unchanged: kept</text>
<path d="M640,360 L640,412 L666,412" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="668" y="396" width="220" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="778.0" y="418.0" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">BallotLine key={counted}</text>
<text x="778" y="448" font-size="12" fill="#991b1b" text-anchor="middle">key 5 becomes 6: only this line</text>
<text x="778" y="464" font-size="12" fill="#991b1b" text-anchor="middle">is new, so its arrival plays again</text>
<rect x="24" y="520" width="932" height="64" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="548" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">A key is not a refresh signal; it is the instance&#x27;s name.</text>
<text x="44" y="572" font-size="14.5" fill="#1f2937" text-anchor="start">A new name builds a new instance with everything under it, so key the smallest thing that must restart.</text>
</svg>