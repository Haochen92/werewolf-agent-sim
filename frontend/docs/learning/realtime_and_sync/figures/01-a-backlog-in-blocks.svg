<text x="230" y="150" font-size="13" fill="#c2410c" text-anchor="start">each frame: a store write, then a render that re-sorts the log and recuts every beat so far</text>
<text x="230" y="168" font-size="13" fill="#c2410c" text-anchor="start">the renders grow with the log, so the whole catch-up grows with the square of its length</text>
<text x="24" y="232" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">Gathered in blocks</text>
<text x="24" y="252" font-size="13" fill="#4b5563" text-anchor="start">(catchUpBatch, as built)</text>
