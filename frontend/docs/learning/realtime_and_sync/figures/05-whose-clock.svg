<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="610" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">Whose clock: the server&#x27;s, shown through an offset</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">The deadline is a time on the server&#x27;s clock. The page reads it through the offset it measured.</text>
<rect x="24" y="86" width="456" height="330" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="44" y="114" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Measuring the offset (recordServerClock)</text>
<text x="44" y="146" font-size="14" fill="#4b5563" text-anchor="start">status says</text>
<text x="150" y="146" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">server_time  12:00:00.0</text>
<text x="44" y="172" font-size="14" fill="#4b5563" text-anchor="start">page&#x27;s clock</text>
<text x="150" y="172" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">Date.now()   12:01:00.3</text>
<text x="44" y="198" font-size="14" fill="#4b5563" text-anchor="start">offset</text>
<text x="150" y="198" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">= server − page = −60.3 s</text>
<line x1="44" y1="216" x2="460" y2="216" stroke="#d1d5db"/>
<text x="44" y="244" font-size="14" fill="#4b5563" text-anchor="start">deadline</text>
<text x="150" y="244" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">12:02:00.0 (server)</text>
<text x="44" y="270" font-size="14" fill="#4b5563" text-anchor="start">serverNow()</text>
<text x="150" y="270" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="start">= Date.now() + offset</text>
<text x="44" y="302" font-size="14" fill="#1f2937" text-anchor="start">This browser runs a minute fast. Without</text>
<text x="44" y="324" font-size="14" fill="#1f2937" text-anchor="start">the offset, the count would read a minute</text>
<text x="44" y="346" font-size="14" fill="#1f2937" text-anchor="start">short. The offset also carries the reply&#x27;s</text>
<text x="44" y="368" font-size="14" fill="#1f2937" text-anchor="start">trip, so the count reads high by that</text>
<text x="44" y="390" font-size="14" fill="#1f2937" text-anchor="start">much (here 0.3 s, made up for the example).</text>
<rect x="500" y="86" width="456" height="330" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="520" y="114" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The stage&#x27;s lag against that clock</text>
<text x="520" y="140" font-size="14" fill="#4b5563" text-anchor="start">A room&#x27;s turn: 120 s from when the server asks.</text>
<text x="520" y="162" font-size="14" fill="#4b5563" text-anchor="start">Holds still to play before the seat&#x27;s turn:</text>
<rect x="520" y="178" width="116.0" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="578.0" y="196" font-size="12.5" fill="#1f2937" text-anchor="middle">speech</text>
<text x="578.0" y="211" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">15 s</text>
<rect x="640.0" y="178" width="28.0" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="654.0" y="196" font-size="10.5" fill="#1f2937" text-anchor="middle">pass</text>
<text x="654.0" y="211" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">4 s</text>
<rect x="672.0" y="178" width="100.0" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="722.0" y="196" font-size="12.5" fill="#1f2937" text-anchor="middle">speech</text>
<text x="722.0" y="211" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">13 s</text>
<rect x="776.0" y="178" width="108.0" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="830.0" y="196" font-size="12.5" fill="#1f2937" text-anchor="middle">speech</text>
<text x="830.0" y="211" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">14 s</text>
<rect x="888.0" y="178" width="60" height="40" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="918.0" y="202" font-size="13" fill="#1f2937" text-anchor="middle">turn</text>
<line x1="650.0" y1="172" x2="650.0" y2="232" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="650.0" y="248" font-size="12.5" fill="#b91c1c" text-anchor="middle">30 s before the turn (TURN_JUMP_MS)</text>
<text x="520" y="280" font-size="14" fill="#1f2937" text-anchor="start">46 s queued, over 30 s: the stage lands still on</text>
<text x="520" y="302" font-size="14" fill="#1f2937" text-anchor="start">the last beat before the turn, and the turn plays.</text>
<text x="520" y="324" font-size="14" fill="#1f2937" text-anchor="start">The skipped lines are in the transcript.</text>
<text x="520" y="346" font-size="14" fill="#1f2937" text-anchor="start">30 s or under: the beat on stage is cut short</text>
<text x="520" y="368" font-size="14" fill="#1f2937" text-anchor="start">once, the rest play at their holds.</text>
<rect x="24" y="436" width="932" height="150" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="464" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The authority stays on the server (timing sheet, ruling 4)</text>
<text x="44" y="490" font-size="14.5" fill="#1f2937" text-anchor="start">The server&#x27;s clock starts when it asks, and at the deadline the seat&#x27;s agent answers. The browser only shows</text>
<text x="44" y="513" font-size="14.5" fill="#1f2937" text-anchor="start">the time left; it never holds the clock, for itself or for others. A browser that told the server where its</text>
<text x="44" y="536" font-size="14.5" fill="#1f2937" text-anchor="start">stage was, or asked for the next beat, was set aside: an exact clock, at the price of the table waiting on its</text>
<text x="44" y="559" font-size="14.5" fill="#1f2937" text-anchor="start">slowest reader. The jump is for the seat&#x27;s own turn on a room&#x27;s clock only; the general jump is not built.</text>
</svg>