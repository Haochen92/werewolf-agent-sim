<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="520" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">When sound may start, and the state the standard does not have</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">music/player.ts: one AudioContext per page, made inside the viewer&#x27;s first press on a page with music.</text>
<rect x="24" y="110" width="220" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="134.0" y="138" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">no context</text>
<text x="134.0" y="160" font-size="12.5" fill="#4b5563" text-anchor="middle">a bed is only remembered</text>
<rect x="380" y="110" width="220" height="70" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="490.0" y="138" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">running</text>
<text x="490.0" y="160" font-size="12.5" fill="#4b5563" text-anchor="middle">beds and stings play</text>
<rect x="736" y="110" width="220" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="846.0" y="138" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">suspended</text>
<text x="846.0" y="160" font-size="12.5" fill="#4b5563" text-anchor="middle">the clock stops with it</text>
<rect x="380" y="300" width="220" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="490.0" y="328" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">interrupted</text>
<text x="490.0" y="350" font-size="12.5" fill="#4b5563" text-anchor="middle">iPhone Safari only</text>
<path d="M244,145 L378,145" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="311" y="134" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="middle">first press</text>
<text x="311" y="200" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2937" text-anchor="middle">new AudioContext()</text>
<text x="311" y="216" font-size="12" fill="#4b5563" text-anchor="middle">+ resume(), in the handler</text>
<path d="M600,135 L734,135" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="667" y="124" font-size="12" fill="#1f2937" text-anchor="middle">page hidden, or idle 4 s</text>
<path d="M734,158 L602,158" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="667" y="176" font-size="12" fill="#1f2937" text-anchor="middle">shown, or a press</text>
<path d="M490,182 L490,298" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#r)"/>
<text x="500" y="246" font-size="12.5" fill="#991b1b" text-anchor="start">another app, a call</text>
<path d="M380,335 Q134,335 134,184" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#r)"/>
<text x="200" y="254" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="start">next press: close it</text>
<text x="200" y="272" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="start">and make a new one</text>
<text x="200" y="290" font-size="12" fill="#4b5563" text-anchor="start">(its decoded tracks go too)</text>
<text x="620" y="330" font-size="12.5" fill="#1f2937" text-anchor="start">a resume may be refused for a while;</text>
<text x="620" y="348" font-size="12.5" fill="#1f2937" text-anchor="start">a check for &#x27;suspended&#x27; never matches it</text>
<rect x="24" y="400" width="932" height="104" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="428" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The press (music.ts, MusicDirector)</text>
<text x="44" y="454" font-size="14.5" fill="#1f2937" text-anchor="start">pointerdown, pointerup and keydown, heard on window in the capture phase. An iPhone took no touch as</text>
<text x="44" y="477" font-size="14.5" fill="#1f2937" text-anchor="start">permission on pointerdown alone, hence pointerup. A press on a page without music opens no sound device.</text>
</svg>