<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="500" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">One tab on the owner&#x27;s iPhone, at rest, before and after</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">Safari&#x27;s Layers panel, the replay before day 1, 2026-10-02: one reading of each (build_log §8.3).</text>
<line x1="900.0" y1="96" x2="900.0" y2="330" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="900.0" y="90" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">about 1 GB</text>
<line x1="150.0" y1="104" x2="150.0" y2="330" stroke="#e5e7eb"/>
<text x="150.0" y="348" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">0 MB</text>
<line x1="337.5" y1="104" x2="337.5" y2="330" stroke="#e5e7eb"/>
<text x="337.5" y="348" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">250 MB</text>
<line x1="525.0" y1="104" x2="525.0" y2="330" stroke="#e5e7eb"/>
<text x="525.0" y="348" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">500 MB</text>
<line x1="712.5" y1="104" x2="712.5" y2="330" stroke="#e5e7eb"/>
<text x="712.5" y="348" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">750 MB</text>
<text x="24" y="146" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">Before</text>
<text x="24" y="166" font-size="13" fill="#4b5563" text-anchor="start">17 layers</text>
<rect x="150" y="120" width="282.0" height="52" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="291.0" y="151" font-size="12.5" fill="#1f2937" text-anchor="middle">six stage layers (54–92 MB each), six others</text>
<rect x="432.0" y="120" width="54.75" height="52" rx="2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<rect x="486.75" y="120" width="39.0" height="52" rx="2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<rect x="525.75" y="120" width="8.25" height="52" rx="2" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<rect x="534.0" y="120" width="16.5" height="52" rx="2" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="560.5" y="151" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">534 MB</text>
<text x="432.0" y="192" font-size="12" fill="#4b5563" text-anchor="start">then: camera 73 · an svg sheet 52 · felt window 11 · document and root 11 each</text>
<text x="24" y="262" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">After</text>
<text x="24" y="282" font-size="13" fill="#4b5563" text-anchor="start">3 layers</text>
<rect x="150" y="236" width="69.0" height="52" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="184.5" y="267" font-size="12.5" fill="#1f2937" text-anchor="middle">world</text>
<rect x="219.0" y="236" width="16.5" height="52" rx="2" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="245.5" y="267" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">114 MB</text>
<text x="150" y="308" font-size="12" fill="#4b5563" text-anchor="start">the world 92 · document and root 11 each</text>
<rect x="24" y="372" width="932" height="112" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="400" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">What changed between the two readings</text>
<text x="44" y="426" font-size="14.5" fill="#1f2937" text-anchor="start">Every scene in the car stood in front of one baked picture, and the camera lost its layer on phones.</text>
<text x="44" y="449" font-size="14.5" fill="#1f2937" text-anchor="start">The felt window&#x27;s endless scroll had promoted every stage layer painted above it (rendering_pipeline).</text>
<text x="44" y="472" font-size="14.5" fill="#1f2937" text-anchor="start">The 1 GB line is the build log&#x27;s working estimate of the tab&#x27;s budget, not a measured limit.</text>
</svg>