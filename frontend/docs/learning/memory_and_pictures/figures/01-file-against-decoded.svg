<text x="24" y="500" font-size="13.5" fill="#1f2937" text-anchor="start">A picture is held as width × height × 4 bytes; a sound as seconds × sample rate × channels × 4.</text>
<text x="24" y="524" font-size="13" fill="#4b5563" text-anchor="start">Files as committed on 2026-10-26 (WebP; the track is MP3). The track is shown decoded at 48,000 samples a second;</text>
<text x="24" y="544" font-size="13" fill="#4b5563" text-anchor="start">it is decoded at its AudioContext&#x27;s rate, so at 44,100 it holds 30.8 MB. KB and MB here are 1,000 and 1,000,000 bytes.</text>
