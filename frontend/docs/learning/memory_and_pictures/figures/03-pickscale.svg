<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="530" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">pickScale: the sheet from the pixels the stage is drawn at</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">need = the stage&#x27;s measured css width × the screen&#x27;s density × 1.32 (the camera&#x27;s closest push-in)</text>
<rect x="60.0" y="200" width="411.304347826087" height="34" rx="0" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="265.6521739130435" y="222" font-size="13" fill="#1f2937" text-anchor="middle">1× sheet, 2200 px wide</text>
<rect x="471.304347826087" y="200" width="205.65217391304338" height="34" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="574.1304347826087" y="222" font-size="13" fill="#1f2937" text-anchor="middle">1.5×, 3300</text>
<rect x="676.9565217391304" y="200" width="205.6521739130436" height="34" rx="0" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="779.7826086956522" y="222" font-size="13" fill="#1f2937" text-anchor="middle">2×, 4400</text>
<rect x="882.608695652174" y="200" width="37.39130434782601" height="34" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="60.0" y1="234" x2="60.0" y2="244" stroke="#6b7280"/>
<text x="60.0" y="258" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">0</text>
<line x1="471.304347826087" y1="234" x2="471.304347826087" y2="244" stroke="#6b7280"/>
<text x="471.304347826087" y="258" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">2200</text>
<line x1="676.9565217391304" y1="234" x2="676.9565217391304" y2="244" stroke="#6b7280"/>
<text x="676.9565217391304" y="258" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">3300</text>
<line x1="882.608695652174" y1="234" x2="882.608695652174" y2="244" stroke="#6b7280"/>
<text x="882.608695652174" y="258" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">4400</text>
<text x="920" y="282" font-size="12" fill="#4b5563" text-anchor="end">physical px</text>
<line x1="307.3434782608696" y1="130" x2="307.3434782608696" y2="200" stroke="#1f2937" stroke-width="1.4"/>
<circle cx="307.3434782608696" cy="200" r="4" fill="#1f2937"/>
<text x="307.3434782608696" y="96" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">carriage, upright phone</text>
<text x="307.3434782608696" y="114" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">334 × 3 × 1.32 = 1323</text>
<line x1="454.8521739130435" y1="174" x2="454.8521739130435" y2="200" stroke="#1f2937" stroke-width="1.4"/>
<circle cx="454.8521739130435" cy="200" r="4" fill="#1f2937"/>
<text x="454.8521739130435" y="140" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">desktop at density 1</text>
<text x="454.8521739130435" y="158" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">1600 × 1 × 1.32 = 2112</text>
<line x1="573.008695652174" y1="130" x2="573.008695652174" y2="200" stroke="#1f2937" stroke-width="1.4"/>
<circle cx="573.008695652174" cy="200" r="4" fill="#1f2937"/>
<text x="573.008695652174" y="96" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">theatre, phone on its side</text>
<text x="573.008695652174" y="114" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">693 × 3 × 1.32 = 2744</text>
<line x1="849.704347826087" y1="174" x2="849.704347826087" y2="200" stroke="#1f2937" stroke-width="1.4"/>
<circle cx="849.704347826087" cy="200" r="4" fill="#1f2937"/>
<text x="849.704347826087" y="140" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">desktop at density 2</text>
<text x="849.704347826087" y="158" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">1600 × 2 × 1.32 = 4224</text>
<rect x="430.17391304347825" y="270" width="41.130434782608745" height="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="422.17391304347825" y="282" font-size="12.5" fill="#991b1b" text-anchor="end">1980 to 2200: a 1.5× already shown is kept (SLACK, 10%)</text>
<rect x="24" y="320" width="452" height="190" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="348" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">The rules in the code</text>
<text x="44" y="374" font-size="14.5" fill="#1f2937" text-anchor="start">The smallest sheet at or above the need.</text>
<text x="44" y="397" font-size="14.5" fill="#1f2937" text-anchor="start">A small (phone) stage is capped at 1.5×:</text>
<text x="44" y="420" font-size="14.5" fill="#1f2937" text-anchor="start">1100 × 3 × 1.32 = 4356 still takes 3300.</text>
<text x="44" y="443" font-size="14.5" fill="#1f2937" text-anchor="start">Up at once; down only 10% under,</text>
<text x="44" y="466" font-size="14.5" fill="#1f2937" text-anchor="start">so a resize near a line does not swap.</text>
<text x="44" y="489" font-size="14.5" fill="#1f2937" text-anchor="start">No sheet until the Stage has measured itself.</text>
<rect x="500" y="320" width="456" height="190" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="520" y="348" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Before 2026-10-11</text>
<text x="520" y="374" font-size="14.5" fill="#1f2937" text-anchor="start">The pick read the screen&#x27;s density alone, in an</text>
<text x="520" y="397" font-size="14.5" fill="#1f2937" text-anchor="start">effect, after a 1× default. The carriage&#x27;s 334 px</text>
<text x="520" y="420" font-size="14.5" fill="#1f2937" text-anchor="start">stage on a phone took the 3300 sheet: 17.8 MB</text>
<text x="520" y="443" font-size="14.5" fill="#1f2937" text-anchor="start">held where the 2200 sheet&#x27;s 7.9 MB covered it,</text>
<text x="520" y="466" font-size="14.5" fill="#1f2937" text-anchor="start">and Chromium fetched both sheets (audit §1).</text>
</svg>