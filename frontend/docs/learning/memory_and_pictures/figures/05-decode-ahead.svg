<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="530" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">Decode ahead: the pictures of the beat after this one</text>
<text x="24" y="62" font-size="14" fill="#4b5563" text-anchor="start">A replay, Reveal on: seat 3 speaks, then seat 5 passes. A pass rises thinking and rests (base) 0.6 s in.</text>
<text x="24" y="118" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">the stage</text>
<rect x="158.0" y="96" width="312.0" height="34" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="314.0" y="118" font-size="13" fill="#1f2937" text-anchor="middle">seat 3&#x27;s line</text>
<rect x="470" y="96" width="480" height="34" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<line x1="498.8" y1="96" x2="498.8" y2="130" stroke="#b45309" stroke-width="2"/>
<text x="506.8" y="118" font-size="13" fill="#1f2937" text-anchor="start">seat 5&#x27;s pass: thinking, then base from 0.6 s</text>
<line x1="182" y1="136" x2="182" y2="142" stroke="#6b7280"/>
<text x="182" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">-6 s</text>
<line x1="278" y1="136" x2="278" y2="142" stroke="#6b7280"/>
<text x="278" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">-4 s</text>
<line x1="374" y1="136" x2="374" y2="142" stroke="#6b7280"/>
<text x="374" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">-2 s</text>
<line x1="470" y1="136" x2="470" y2="142" stroke="#6b7280"/>
<text x="470" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">0 s</text>
<line x1="566" y1="136" x2="566" y2="142" stroke="#6b7280"/>
<text x="566" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">2 s</text>
<line x1="662" y1="136" x2="662" y2="142" stroke="#6b7280"/>
<text x="662" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">4 s</text>
<line x1="758" y1="136" x2="758" y2="142" stroke="#6b7280"/>
<text x="758" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">6 s</text>
<line x1="854" y1="136" x2="854" y2="142" stroke="#6b7280"/>
<text x="854" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">8 s</text>
<line x1="950" y1="136" x2="950" y2="142" stroke="#6b7280"/>
<text x="950" y="156" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4b5563" text-anchor="middle">10 s</text>
<text x="24" y="216" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">Before</text>
<text x="24" y="236" font-size="12.5" fill="#4b5563" text-anchor="start">held: thinking, talking</text>
<rect x="182" y="200" width="288" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="326" y="218" font-size="12.5" fill="#1f2937" text-anchor="middle">thinking + talking decoded</text>
<circle cx="537.2" cy="213" r="6" fill="#b91c1c"/>
<text x="549.2" y="218" font-size="12.5" fill="#991b1b" text-anchor="start">base first requested 1.4 s in: it pops</text>
<text x="24" y="286" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">After</text>
<text x="24" y="306" font-size="12.5" fill="#4b5563" text-anchor="start">held: thinking, base</text>
<rect x="182" y="270" width="288" height="26" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="326" y="288" font-size="12.5" fill="#1f2937" text-anchor="middle">thinking + base, 4 to 6 s before</text>
<text x="510.8" y="288" font-size="12.5" fill="#14532d" text-anchor="start">base painted from the held decode</text>
<rect x="24" y="340" width="452" height="168" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="44" y="368" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">What spritesAhead picks (ahead.ts)</text>
<text x="44" y="394" font-size="14.5" fill="#1f2937" text-anchor="start">The next day turn after this beat with a</text>
<text x="44" y="417" font-size="14.5" fill="#1f2937" text-anchor="start">puppet at the stand, and its speaker&#x27;s pair:</text>
<text x="44" y="440" font-size="14.5" fill="#1f2937" text-anchor="start">a line: thinking and talking</text>
<text x="44" y="463" font-size="14.5" fill="#1f2937" text-anchor="start">a pass: thinking and base</text>
<rect x="500" y="340" width="456" height="168" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="520" y="368" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">What it costs</text>
<text x="520" y="394" font-size="14.5" fill="#1f2937" text-anchor="start">One pair held at a time: a pose holds about</text>
<text x="520" y="417" font-size="14.5" fill="#1f2937" text-anchor="start">4 MB decoded. Probed on production, 2026-10-16.</text>
<text x="520" y="440" font-size="14.5" fill="#1f2937" text-anchor="start">Replay only. Live or replay, a day turn also</text>
<text x="520" y="463" font-size="14.5" fill="#1f2937" text-anchor="start">waits up to 2 s for its poses (pictures.ts).</text>
</svg>