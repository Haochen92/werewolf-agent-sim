<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="820" height="500" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#111">One server process: what every game shares, and what each game gets</text>

  <!-- process frame -->
  <rect x="10" y="38" width="800" height="378" rx="8" fill="none" stroke="#999" stroke-width="1.2"/>

  <!-- event loop: shared -->
  <rect x="30" y="54" width="230" height="230" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="42" y="76" font-weight="bold" fill="#1a365d">Event loop (1 thread)</text>
  <text x="42" y="94" fill="#555" font-size="12">Shared by every game</text>
  <text x="42" y="118" fill="#222">Web requests (the HTTP routes)</text>
  <text x="42" y="136" fill="#222">One stream per viewer, own queue</text>
  <text x="42" y="154" fill="#222">Each game's event log writes</text>

  <!-- main pool: shared -->
  <rect x="290" y="54" width="240" height="230" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/>
  <text x="302" y="76" font-weight="bold" fill="#1c4532">Main thread pool (64 threads)</text>
  <text x="302" y="94" fill="#555" font-size="12">Shared by every game</text>
  <text x="302" y="118" fill="#222">Small blocking jobs from web</text>
  <text x="302" y="136" fill="#222">requests (key check, drafts)</text>

  <!-- per-phase pools: not shared -->
  <text x="572" y="76" font-weight="bold" fill="#1c4532">Per-phase thread pools</text>
  <text x="572" y="94" fill="#555" font-size="12">Not shared. One per game, for one</text>
  <text x="572" y="110" fill="#555" font-size="12">run of the day phase or the wolf</text>
  <text x="572" y="126" fill="#555" font-size="12">pack's phase. Made by the library,</text>
  <text x="572" y="142" fill="#555" font-size="12">discarded when the phase ends.</text>

  <!-- game A row -->
  <rect x="42" y="172" width="206" height="44" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="52" y="190" font-weight="bold" fill="#222">Game A</text>
  <text x="52" y="207" fill="#222" font-size="12">1 task, for the whole game</text>
  <rect x="302" y="172" width="216" height="44" rx="5" fill="#ffffff" stroke="#2f855a"/>
  <text x="312" y="190" font-weight="bold" fill="#222">Game A</text>
  <text x="312" y="207" fill="#222" font-size="12">1 thread by day, up to 9 at night</text>
  <rect x="572" y="172" width="218" height="44" rx="5" fill="#eef7ee" stroke="#2f855a" stroke-dasharray="6 3"/>
  <text x="582" y="190" font-weight="bold" fill="#222">Game A's day phase</text>
  <text x="582" y="207" fill="#222" font-size="12">Own pool, one thread per seat</text>
  <line x1="248" y1="194" x2="300" y2="194" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="518" y1="194" x2="570" y2="194" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- game B row -->
  <rect x="42" y="228" width="206" height="44" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="52" y="246" font-weight="bold" fill="#222">Game B</text>
  <text x="52" y="263" fill="#222" font-size="12">1 task, for the whole game</text>
  <rect x="302" y="228" width="216" height="44" rx="5" fill="#ffffff" stroke="#2f855a"/>
  <text x="312" y="246" font-weight="bold" fill="#222">Game B</text>
  <text x="312" y="263" fill="#222" font-size="12">1 thread by day, up to 9 at night</text>
  <rect x="572" y="228" width="218" height="44" rx="5" fill="#eef7ee" stroke="#2f855a" stroke-dasharray="6 3"/>
  <text x="582" y="246" font-weight="bold" fill="#222">Game B's wolf pack phase</text>
  <text x="582" y="263" fill="#222" font-size="12">Own pool, one thread per wolf</text>
  <line x1="248" y1="250" x2="300" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="518" y1="250" x2="570" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- database access: shared by every game -->
  <rect x="30" y="326" width="230" height="76" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
  <text x="42" y="347" font-weight="bold" fill="#222">The server's own tables</text>
  <text x="42" y="366" fill="#222">Event log, games, rooms</text>
  <text x="42" y="386" fill="#555" font-size="12">5 connections (+10), no lock</text>

  <rect x="290" y="326" width="240" height="76" rx="6" fill="#fdf1e7" stroke="#c05621" stroke-width="1.5"/>
  <text x="302" y="347" font-weight="bold" fill="#7b341e">Lock: saving checkpoints</text>
  <text x="302" y="366" fill="#222">One save at a time, all games</text>
  <text x="302" y="386" fill="#555" font-size="12">4 connections, used one at a time</text>

  <rect x="560" y="326" width="230" height="76" rx="6" fill="#fdf1e7" stroke="#c05621" stroke-width="1.5"/>
  <text x="572" y="347" font-weight="bold" fill="#7b341e">Lock: the lesson store</text>
  <text x="572" y="366" fill="#222">One lookup at a time, all games</text>
  <text x="572" y="386" fill="#555" font-size="12">4 connections, used one at a time</text>

  <line x1="110" y1="284" x2="110" y2="324" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="118" y="308" font-size="11" fill="#444">events</text>
  <line x1="220" y1="284" x2="330" y2="324" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="288" y="302" font-size="11" fill="#444">each game's checkpoints</text>
  <line x1="490" y1="284" x2="600" y2="324" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="272" x2="700" y2="324" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="708" y="302" font-size="11" fill="#444">each seat's lessons</text>

  <!-- outside services -->
  <rect x="30" y="444" width="500" height="40" rx="6" fill="#f4f4f4" stroke="#777"/>
  <text x="42" y="469" fill="#222">Postgres</text>
  <rect x="560" y="444" width="90" height="40" rx="6" fill="#f4f4f4" stroke="#777"/>
  <text x="572" y="469" fill="#222">Postgres</text>
  <rect x="660" y="444" width="130" height="40" rx="6" fill="#f4f4f4" stroke="#777"/>
  <text x="672" y="469" fill="#222">Embedding service</text>
  <line x1="145" y1="402" x2="145" y2="442" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="402" x2="410" y2="442" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="605" y1="402" x2="605" y2="442" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="725" y1="402" x2="725" y2="442" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
