<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="760" height="330" fill="#ffffff"/>
<defs>
<marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#718096"/></marker>
<marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
</defs>
<text x="24" y="28" font-size="16" font-weight="bold" fill="#111">The reply that was sent first arrived second</text>

<text x="24" y="115" font-weight="bold" fill="#222">Server</text>
<line x1="90" y1="110" x2="730" y2="110" stroke="#718096" stroke-width="2" marker-end="url(#g)"/>
<text x="24" y="225" font-weight="bold" fill="#222">Page</text>
<line x1="90" y1="220" x2="730" y2="220" stroke="#718096" stroke-width="2" marker-end="url(#g)"/>
<text x="730" y="244" text-anchor="end" font-size="12" fill="#555">time</text>

<text x="110" y="64" fill="#b7791f" font-weight="bold">Status reply, written at event 57</text>
<text x="110" y="84" fill="#555" font-size="13">"No seat owes a turn"</text>
<circle cx="150" cy="110" r="6" fill="#b7791f"/>
<line x1="150" y1="110" x2="606" y2="218" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#o)"/>
<text x="250" y="150" fill="#b7791f" font-size="13" transform="rotate(13.3 250 150)">slow to arrive</text>

<text x="400" y="64" fill="#2b6cb0" font-weight="bold">Event 58 on the stream</text>
<text x="400" y="84" fill="#555" font-size="13">A turn request for this player</text>
<circle cx="420" cy="110" r="6" fill="#2b6cb0"/>
<line x1="420" y1="110" x2="456" y2="217" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#b)"/>

<text x="456" y="246" text-anchor="middle" fill="#2b6cb0" font-weight="bold">Opens the turn</text>
<text x="610" y="246" text-anchor="middle" fill="#b7791f" font-weight="bold">Late reply arrives</text>
<text x="610" y="274" text-anchor="middle" fill="#c53030">Before: closes the turn</text>
<text x="610" y="296" text-anchor="middle" fill="#2f855a">Now: 57 is older than 58, ignored</text>
</svg>
