<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="820" height="430" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#111">Now: the key that changes is on the newest ballot line only</text>
<text x="20" y="46" fill="#555" font-size="12">The same two beats: beat 5, then beat 6</text>
<text x="205" y="76" text-anchor="middle" fill="#555" font-size="12">Beat 5</text>
<rect x="105" y="86" width="200" height="44" rx="6" fill="#edf0f4" stroke="#718096" stroke-width="1.5"/><text x="205.0" y="113.0" text-anchor="middle" fill="#222" font-weight="bold">Scene</text>
<polyline points="205,130 205,156" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="60" y="156" width="290" height="44" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/><text x="205.0" y="176.0" text-anchor="middle" fill="#1c4532" font-weight="bold">The vote's content</text><text x="205.0" y="192.0" text-anchor="middle" fill="#555" font-size="12">key: viewer and choice (unchanged)</text>
<polyline points="90,200 90,246 120,246" fill="none" stroke="#999" stroke-width="1.3"/>
<polyline points="90,246 90,324 120,324" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="120" y="224" width="230" height="44" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/><text x="235.0" y="244.0" text-anchor="middle" fill="#1c4532" font-weight="bold">The rest of the scene</text><text x="235.0" y="260.0" text-anchor="middle" fill="#555" font-size="12">car, light, seats, earlier ballots</text>
<rect x="102" y="288" width="268" height="72" rx="10" fill="none" stroke="#c53030" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="120" y="302" width="230" height="44" rx="6" fill="#fdf0f0" stroke="#c53030" stroke-width="1.5"/><text x="235.0" y="322.0" text-anchor="middle" fill="#742a2a" font-weight="bold">Newest ballot line</text><text x="235.0" y="338.0" text-anchor="middle" fill="#555" font-size="12">key: count 5</text>
<text x="236" y="382" text-anchor="middle" fill="#c53030" font-size="13" font-weight="bold">Unmounted</text>
<text x="615" y="76" text-anchor="middle" fill="#555" font-size="12">Beat 6</text>
<rect x="515" y="86" width="200" height="44" rx="6" fill="#edf0f4" stroke="#718096" stroke-width="1.5"/><text x="615.0" y="113.0" text-anchor="middle" fill="#222" font-weight="bold">Scene</text>
<polyline points="615,130 615,156" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="470" y="156" width="290" height="44" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/><text x="615.0" y="176.0" text-anchor="middle" fill="#1c4532" font-weight="bold">The vote's content</text><text x="615.0" y="192.0" text-anchor="middle" fill="#555" font-size="12">key: viewer and choice (unchanged)</text>
<polyline points="500,200 500,246 530,246" fill="none" stroke="#999" stroke-width="1.3"/>
<polyline points="500,246 500,324 530,324" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="530" y="224" width="230" height="44" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/><text x="645.0" y="244.0" text-anchor="middle" fill="#1c4532" font-weight="bold">The rest of the scene</text><text x="645.0" y="260.0" text-anchor="middle" fill="#555" font-size="12">car, light, seats, earlier ballots</text>
<rect x="512" y="288" width="268" height="72" rx="10" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="530" y="302" width="230" height="44" rx="6" fill="#ebf4fb" stroke="#2b6cb0" stroke-width="1.5"/><text x="645.0" y="322.0" text-anchor="middle" fill="#1a365d" font-weight="bold">Newest ballot line</text><text x="645.0" y="338.0" text-anchor="middle" fill="#555" font-size="12">key: count 6</text>
<text x="646" y="382" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">Mounted new</text>
<line x1="392" y1="108" x2="428" y2="108" stroke="#333" stroke-width="2"/><polyline points="420,101 428,108 420,115" fill="none" stroke="#333" stroke-width="2"/>
<rect x="372" y="232" width="76" height="28" rx="6" fill="#2f855a"/>
<text x="410" y="251" text-anchor="middle" fill="#ffffff" font-weight="bold">Kept</text>
<text x="410" y="416" text-anchor="middle" fill="#333" font-size="12">The vote's content keeps the same key on both beats, so it stays. Only the newest ballot line is replaced.</text>
</svg>