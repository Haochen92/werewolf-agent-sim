<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/>
    </marker>
  </defs>
  <rect width="820" height="372" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#111">Who can open a connection, and who can send on it</text>

  <!-- ============ case 1: the browser opens ============ -->
  <text x="20" y="58" font-weight="bold" fill="#1c4532">A. The browser opens the connection: this works</text>

  <rect x="20" y="70" width="190" height="96" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="32" y="94" font-weight="bold" fill="#1a365d">Browser page</text>
  <text x="32" y="114" fill="#222" font-size="12">on a phone or laptop</text>
  <text x="32" y="132" fill="#222" font-size="12">Can open connections</text>

  <rect x="610" y="70" width="190" height="96" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/>
  <text x="622" y="94" font-weight="bold" fill="#1c4532">Server</text>
  <text x="622" y="114" fill="#222" font-size="12">Listens at a known</text>
  <text x="622" y="132" fill="#222" font-size="12">address and port</text>

  <rect x="400" y="70" width="20" height="96" fill="#eeeeee" stroke="#999"/>
  <text x="410" y="184" text-anchor="middle" fill="#555" font-size="12">Router or firewall: lets it through</text>

  <line x1="212" y1="104" x2="606" y2="104" stroke="#444" stroke-width="1.8" marker-end="url(#dark)"/>
  <text x="224" y="96" fill="#222" font-size="12" paint-order="stroke" stroke="#ffffff" stroke-width="4">1. The browser opens a connection to the server's address</text>

  <line x1="608" y1="148" x2="216" y2="148" stroke="#2f855a" stroke-width="1.8" marker-end="url(#green)"/>
  <text x="224" y="140" fill="#1c4532" font-size="12" paint-order="stroke" stroke="#ffffff" stroke-width="4">2. Later, the server sends data on that same open connection</text>

  <!-- ============ case 2: the server tries to open ============ -->
  <text x="20" y="228" font-weight="bold" fill="#9b2c2c">B. The server tries to open a connection: this cannot work</text>

  <rect x="20" y="240" width="190" height="96" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="32" y="264" font-weight="bold" fill="#1a365d">Browser page</text>
  <text x="32" y="284" fill="#9b2c2c" font-size="12">Page code has no way to</text>
  <text x="32" y="300" fill="#9b2c2c" font-size="12">listen for a connection</text>

  <rect x="610" y="240" width="190" height="96" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/>
  <text x="622" y="264" font-weight="bold" fill="#1c4532">Server</text>
  <text x="622" y="284" fill="#222" font-size="12">Has news to send, but no</text>
  <text x="622" y="300" fill="#222" font-size="12">connection is open</text>

  <rect x="400" y="240" width="20" height="96" fill="#eeeeee" stroke="#999"/>
  <text x="410" y="354" text-anchor="middle" fill="#555" font-size="12">Router or firewall: blocks a connection nobody inside asked for</text>

  <line x1="608" y1="296" x2="440" y2="296" stroke="#c53030" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M424,286 L440,306 M440,286 L424,306" stroke="#c53030" stroke-width="2.6" fill="none"/>
  <text x="600" y="280" text-anchor="end" fill="#9b2c2c" font-size="12" paint-order="stroke" stroke="#ffffff" stroke-width="4">The server tries to open one</text>
</svg>
