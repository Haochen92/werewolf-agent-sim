<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="820" height="430" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#111">Before: the dining car was drawn inside each scene</text>
<text x="20" y="46" fill="#555" font-size="12">A change of scene, from the day to the vote</text>
<text x="205" y="76" text-anchor="middle" fill="#555" font-size="12">During the day</text>
<rect x="105" y="86" width="200" height="44" rx="6" fill="#edf0f4" stroke="#718096" stroke-width="1.5"/><text x="205.0" y="106.0" text-anchor="middle" fill="#222" font-weight="bold">Parent</text><text x="205.0" y="122.0" text-anchor="middle" fill="#555" font-size="12">shows one scene at a time</text>
<polyline points="205,130 205,172" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="40" y="156" width="330" height="214" rx="10" fill="none" stroke="#c53030" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="60" y="172" width="290" height="44" rx="6" fill="#fdf0f0" stroke="#c53030" stroke-width="1.5"/><text x="205.0" y="192.0" text-anchor="middle" fill="#742a2a" font-weight="bold">Day scene</text><text x="205.0" y="208.0" text-anchor="middle" fill="#555" font-size="12">one component type</text>
<polyline points="90,216 90,262 120,262" fill="none" stroke="#999" stroke-width="1.3"/>
<polyline points="90,262 90,324 120,324" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="120" y="240" width="230" height="44" rx="6" fill="#fdf0f0" stroke="#c53030" stroke-width="1.5"/><text x="235.0" y="267.0" text-anchor="middle" fill="#742a2a" font-weight="bold">Dining car</text>
<rect x="120" y="302" width="230" height="44" rx="6" fill="#fdf0f0" stroke="#c53030" stroke-width="1.5"/><text x="235.0" y="329.0" text-anchor="middle" fill="#742a2a" font-weight="bold">The day's own parts</text>
<text x="205" y="392" text-anchor="middle" fill="#c53030" font-size="13" font-weight="bold">Whole subtree unmounted</text>
<text x="615" y="76" text-anchor="middle" fill="#555" font-size="12">During the vote</text>
<rect x="515" y="86" width="200" height="44" rx="6" fill="#edf0f4" stroke="#718096" stroke-width="1.5"/><text x="615.0" y="106.0" text-anchor="middle" fill="#222" font-weight="bold">Parent</text><text x="615.0" y="122.0" text-anchor="middle" fill="#555" font-size="12">shows one scene at a time</text>
<polyline points="615,130 615,172" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="450" y="156" width="330" height="214" rx="10" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="470" y="172" width="290" height="44" rx="6" fill="#ebf4fb" stroke="#2b6cb0" stroke-width="1.5"/><text x="615.0" y="192.0" text-anchor="middle" fill="#1a365d" font-weight="bold">Vote scene</text><text x="615.0" y="208.0" text-anchor="middle" fill="#555" font-size="12">one component type</text>
<polyline points="500,216 500,262 530,262" fill="none" stroke="#999" stroke-width="1.3"/>
<polyline points="500,262 500,324 530,324" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="530" y="240" width="230" height="44" rx="6" fill="#ebf4fb" stroke="#2b6cb0" stroke-width="1.5"/><text x="645.0" y="267.0" text-anchor="middle" fill="#1a365d" font-weight="bold">Dining car</text>
<rect x="530" y="302" width="230" height="44" rx="6" fill="#ebf4fb" stroke="#2b6cb0" stroke-width="1.5"/><text x="645.0" y="329.0" text-anchor="middle" fill="#1a365d" font-weight="bold">The vote's own parts</text>
<text x="615" y="392" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">Whole subtree mounted new: the car is built again</text>
<line x1="392" y1="108" x2="428" y2="108" stroke="#333" stroke-width="2"/><polyline points="420,101 428,108 420,115" fill="none" stroke="#333" stroke-width="2"/>
<text x="410" y="418" text-anchor="middle" fill="#333" font-size="12">Both scenes draw the same dining car, but each car belongs to a different component instance.</text>
</svg>