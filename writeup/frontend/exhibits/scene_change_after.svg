<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="820" height="470" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#111">Now: the host draws the dining car, outside the part that is replaced</text>
<text x="20" y="46" fill="#555" font-size="12">The same change of scene, from the day to the vote</text>
<text x="205" y="76" text-anchor="middle" fill="#555" font-size="12">During the day</text>
<rect x="60" y="86" width="290" height="44" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/><text x="205.0" y="106.0" text-anchor="middle" fill="#1c4532" font-weight="bold">Host</text><text x="205.0" y="122.0" text-anchor="middle" fill="#555" font-size="12">the same instance for every scene</text>
<polyline points="90,130 90,182 120,182" fill="none" stroke="#999" stroke-width="1.3"/>
<polyline points="90,182 90,268 120,268" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="120" y="160" width="230" height="44" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/><text x="235.0" y="187.0" text-anchor="middle" fill="#1c4532" font-weight="bold">Dining car (the set)</text>
<rect x="102" y="232" width="268" height="150" rx="10" fill="none" stroke="#c53030" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="120" y="246" width="230" height="44" rx="6" fill="#fdf0f0" stroke="#c53030" stroke-width="1.5"/><text x="235.0" y="273.0" text-anchor="middle" fill="#742a2a" font-weight="bold">Body: the day</text>
<polyline points="150,290 150,340 170,340" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="170" y="318" width="180" height="44" rx="6" fill="#fdf0f0" stroke="#c53030" stroke-width="1.5"/><text x="260.0" y="345.0" text-anchor="middle" fill="#742a2a" font-weight="bold">The day's own parts</text>
<text x="236" y="404" text-anchor="middle" fill="#c53030" font-size="13" font-weight="bold">Unmounted</text>
<text x="615" y="76" text-anchor="middle" fill="#555" font-size="12">During the vote</text>
<rect x="470" y="86" width="290" height="44" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/><text x="615.0" y="106.0" text-anchor="middle" fill="#1c4532" font-weight="bold">Host</text><text x="615.0" y="122.0" text-anchor="middle" fill="#555" font-size="12">the same instance for every scene</text>
<polyline points="500,130 500,182 530,182" fill="none" stroke="#999" stroke-width="1.3"/>
<polyline points="500,182 500,268 530,268" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="530" y="160" width="230" height="44" rx="6" fill="#eef7ee" stroke="#2f855a" stroke-width="1.5"/><text x="645.0" y="187.0" text-anchor="middle" fill="#1c4532" font-weight="bold">Dining car (the set)</text>
<rect x="512" y="232" width="268" height="150" rx="10" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="530" y="246" width="230" height="44" rx="6" fill="#ebf4fb" stroke="#2b6cb0" stroke-width="1.5"/><text x="645.0" y="273.0" text-anchor="middle" fill="#1a365d" font-weight="bold">Body: the vote</text>
<polyline points="560,290 560,340 580,340" fill="none" stroke="#999" stroke-width="1.3"/>
<rect x="580" y="318" width="180" height="44" rx="6" fill="#ebf4fb" stroke="#2b6cb0" stroke-width="1.5"/><text x="670.0" y="345.0" text-anchor="middle" fill="#1a365d" font-weight="bold">The vote's own parts</text>
<text x="646" y="404" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">Mounted new</text>
<line x1="392" y1="108" x2="428" y2="108" stroke="#333" stroke-width="2"/><polyline points="420,101 428,108 420,115" fill="none" stroke="#333" stroke-width="2"/>
<rect x="372" y="168" width="76" height="28" rx="6" fill="#2f855a"/>
<text x="410" y="187" text-anchor="middle" fill="#ffffff" font-weight="bold">Kept</text>
<text x="410" y="436" text-anchor="middle" fill="#333" font-size="12">The dining car is outside the subtree that is replaced, so its instance is kept across the change of scene.</text>
<text x="410" y="454" text-anchor="middle" fill="#333" font-size="12">It may still render again, but it is not unmounted.</text>
</svg>