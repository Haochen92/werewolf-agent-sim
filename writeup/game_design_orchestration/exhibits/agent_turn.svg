<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>One agent turn: permitted input, model reply, check, retry or fallback, then the hand-off to the game</title>
  <rect width="900" height="330" fill="#ffffff"/>

  <!-- Input -->
  <rect x="20" y="40" width="170" height="130" rx="10" fill="#eef5ec" stroke="#4f8a4a" stroke-width="2"/>
  <text x="34" y="64" font-size="14" font-weight="bold" fill="#2c5a28">The player's input</text>
  <text x="34" y="88" font-size="12.5" fill="#333">What this player may</text>
  <text x="34" y="105" font-size="12.5" fill="#333">see; the phase; what</text>
  <text x="34" y="122" font-size="12.5" fill="#333">kind of answer is due;</text>
  <text x="34" y="139" font-size="12.5" fill="#333">the legal choices</text>

  <line x1="190" y1="105" x2="207" y2="105" stroke="#444" stroke-width="2"/>
  <polygon points="217,105 205,99 205,111" fill="#444"/>

  <!-- Model reply -->
  <rect x="217" y="40" width="140" height="130" rx="10" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="2"/>
  <text x="231" y="64" font-size="14" font-weight="bold" fill="#26325a">Model reply</text>
  <text x="231" y="88" font-size="12.5" fill="#333">Speech, or a</text>
  <text x="231" y="105" font-size="12.5" fill="#333">choice and its</text>
  <text x="231" y="122" font-size="12.5" fill="#333">reason, in a fixed</text>
  <text x="231" y="139" font-size="12.5" fill="#333">format</text>

  <line x1="357" y1="105" x2="374" y2="105" stroke="#444" stroke-width="2"/>
  <polygon points="384,105 372,99 372,111" fill="#444"/>

  <!-- Check -->
  <polygon points="454,45 524,105 454,165 384,105" fill="#ede7f6" stroke="#6a4c93" stroke-width="2"/>
  <text x="454" y="100" font-size="13" font-weight="bold" fill="#3d2a5c" text-anchor="middle">Readable</text>
  <text x="454" y="117" font-size="13" font-weight="bold" fill="#3d2a5c" text-anchor="middle">and legal?</text>

  <line x1="524" y1="105" x2="566" y2="105" stroke="#444" stroke-width="2"/>
  <polygon points="576,105 564,99 564,111" fill="#444"/>
  <text x="548" y="96" font-size="12" fill="#2c5a28" text-anchor="middle">yes</text>

  <!-- Accepted -->
  <rect x="576" y="55" width="110" height="100" rx="10" fill="#ffffff" stroke="#444" stroke-width="2"/>
  <text x="631" y="100" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Accepted</text>
  <text x="631" y="118" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">answer</text>

  <!-- Outputs -->
  <polyline points="686,105 706,105" fill="none" stroke="#444" stroke-width="2"/>
  <polyline points="706,60 706,190" fill="none" stroke="#444" stroke-width="2"/>
  <line x1="706" y1="60" x2="716" y2="60" stroke="#444" stroke-width="2"/>
  <polygon points="726,60 714,54 714,66" fill="#444"/>
  <line x1="706" y1="190" x2="716" y2="190" stroke="#444" stroke-width="2"/>
  <polygon points="726,190 714,184 714,196" fill="#444"/>

  <rect x="726" y="20" width="160" height="80" rx="10" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <text x="740" y="44" font-size="13.5" font-weight="bold" fill="#5c4410">Speech</text>
  <text x="740" y="65" font-size="12.5" fill="#333">Published to the</text>
  <text x="740" y="82" font-size="12.5" fill="#333">discussion now</text>

  <rect x="726" y="140" width="160" height="110" rx="10" fill="#ede7f6" stroke="#6a4c93" stroke-width="2"/>
  <text x="740" y="164" font-size="13.5" font-weight="bold" fill="#3d2a5c">Vote or night choice</text>
  <text x="740" y="185" font-size="12.5" fill="#333">Collected with the</text>
  <text x="740" y="202" font-size="12.5" fill="#333">others; it changes the</text>
  <text x="740" y="219" font-size="12.5" fill="#333">game only when the</text>
  <text x="740" y="236" font-size="12.5" fill="#333">phase resolves</text>

  <!-- Failure path -->
  <line x1="454" y1="165" x2="454" y2="212" stroke="#a33b3b" stroke-width="2"/>
  <polygon points="454,222 448,210 460,210" fill="#a33b3b"/>
  <text x="464" y="194" font-size="12" fill="#a33b3b">no</text>

  <rect x="374" y="222" width="160" height="80" rx="10" fill="#fdf3f3" stroke="#a33b3b" stroke-width="2"/>
  <text x="388" y="246" font-size="13.5" font-weight="bold" fill="#6b1f1f">Ask again</text>
  <text x="388" y="267" font-size="12.5" fill="#333">with the format</text>
  <text x="388" y="284" font-size="12.5" fill="#333">enforced</text>

  <line x1="534" y1="262" x2="556" y2="262" stroke="#a33b3b" stroke-width="2"/>
  <polygon points="566,262 554,256 554,268" fill="#a33b3b"/>

  <rect x="566" y="222" width="140" height="80" rx="10" fill="#fdf3f3" stroke="#a33b3b" stroke-width="2"/>
  <text x="580" y="246" font-size="13.5" font-weight="bold" fill="#6b1f1f">Still invalid:</text>
  <text x="580" y="267" font-size="12.5" fill="#333">a legal fallback, e.g.</text>
  <text x="580" y="284" font-size="12.5" fill="#333">pass, or decline</text>

  <!-- Both rejoin Accepted -->
  <line x1="510" y1="222" x2="590" y2="163" stroke="#444" stroke-width="1.6"/>
  <polygon points="598,157 585.6,159.3 592.7,169" fill="#444"/>
  <text x="556" y="196" font-size="11.5" fill="#555" text-anchor="end">valid</text>
  <line x1="650" y1="222" x2="650" y2="166" stroke="#444" stroke-width="1.6"/>
  <polygon points="650,156 644,168 656,168" fill="#444"/>
</svg>
