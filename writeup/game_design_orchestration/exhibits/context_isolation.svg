<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>Each model call receives a view built for its player, never the full game state</title>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- Full game state -->
  <rect x="20" y="30" width="260" height="340" rx="12" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="36" y="56" font-size="15" font-weight="bold" fill="#222">Full game state</text>
  <text x="36" y="75" font-size="12" fill="#666">Held by the game to run the rules</text>

  <rect x="36" y="90" width="228" height="78" rx="8" fill="#eef5ec" stroke="#4f8a4a" stroke-width="1.5"/>
  <text x="48" y="112" font-size="13.5" font-weight="bold" fill="#2c5a28">Public record</text>
  <text x="48" y="132" font-size="12.5" fill="#333">Discussion, votes, morning</text>
  <text x="48" y="150" font-size="12.5" fill="#333">reports, the role lineup</text>

  <rect x="36" y="180" width="228" height="78" rx="8" fill="#fdebd8" stroke="#c4732e" stroke-width="1.5"/>
  <text x="48" y="202" font-size="13.5" font-weight="bold" fill="#5c3410">Each player's private record</text>
  <text x="48" y="222" font-size="12.5" fill="#333">Their role, their night</text>
  <text x="48" y="240" font-size="12.5" fill="#333">actions and results</text>

  <rect x="36" y="270" width="228" height="84" rx="8" fill="#f6dede" stroke="#a33b3b" stroke-width="1.5"/>
  <text x="48" y="292" font-size="13.5" font-weight="bold" fill="#6b1f1f">Wolves only</text>
  <text x="48" y="312" font-size="12.5" fill="#333">Who the wolves are,</text>
  <text x="48" y="330" font-size="12.5" fill="#333">and the wolves' chat</text>

  <!-- Builder -->
  <line x1="280" y1="200" x2="310" y2="200" stroke="#444" stroke-width="2"/>
  <polygon points="320,200 308,194 308,206" fill="#444"/>
  <rect x="320" y="140" width="180" height="120" rx="12" fill="#ede7f6" stroke="#6a4c93" stroke-width="2"/>
  <text x="410" y="168" font-size="14" font-weight="bold" fill="#3d2a5c" text-anchor="middle">Build this player's</text>
  <text x="410" y="186" font-size="14" font-weight="bold" fill="#3d2a5c" text-anchor="middle">input</text>
  <text x="410" y="210" font-size="12.5" fill="#333" text-anchor="middle">Selects what this seat</text>
  <text x="410" y="227" font-size="12.5" fill="#333" text-anchor="middle">may see, before the</text>
  <text x="410" y="244" font-size="12.5" fill="#333" text-anchor="middle">prompt is written</text>

  <!-- Fork -->
  <line x1="500" y1="200" x2="530" y2="200" stroke="#444" stroke-width="2"/>
  <polyline points="530,110 530,290" fill="none" stroke="#444" stroke-width="2"/>
  <line x1="530" y1="110" x2="550" y2="110" stroke="#444" stroke-width="2"/>
  <polygon points="560,110 548,104 548,116" fill="#444"/>
  <line x1="530" y1="290" x2="550" y2="290" stroke="#444" stroke-width="2"/>
  <polygon points="560,290 548,284 548,296" fill="#444"/>

  <!-- Investigator -->
  <rect x="560" y="30" width="300" height="160" rx="12" fill="#fffaf0" stroke="#c99a2e" stroke-width="2"/>
  <text x="576" y="56" font-size="14.5" font-weight="bold" fill="#5c4410">Sent to the Investigator's model</text>
  <text x="576" y="80" font-size="12" font-weight="bold" fill="#2c5a28">GETS</text>
  <text x="576" y="99" font-size="13" fill="#333">The public record</text>
  <text x="576" y="117" font-size="13" fill="#333">Its own role and investigation results</text>
  <text x="576" y="143" font-size="12" font-weight="bold" fill="#a33b3b">NEVER GETS</text>
  <text x="576" y="162" font-size="13" fill="#333">Who the wolves are, the wolves' chat</text>
  <text x="576" y="180" font-size="13" fill="#333">Other players' night results</text>

  <!-- Wolf -->
  <rect x="560" y="210" width="300" height="160" rx="12" fill="#fdf3f3" stroke="#a33b3b" stroke-width="2"/>
  <text x="576" y="236" font-size="14.5" font-weight="bold" fill="#6b1f1f">Sent to a wolf's model</text>
  <text x="576" y="260" font-size="12" font-weight="bold" fill="#2c5a28">GETS</text>
  <text x="576" y="279" font-size="13" fill="#333">The public record</text>
  <text x="576" y="297" font-size="13" fill="#333">Its own role and night results</text>
  <text x="576" y="315" font-size="13" fill="#333">Its partner's identity, the wolves' chat</text>
  <text x="576" y="341" font-size="12" font-weight="bold" fill="#a33b3b">NEVER GETS</text>
  <text x="576" y="360" font-size="13" fill="#333">The Investigator's results, or anyone else's</text>

  <!-- Checks -->
  <rect x="20" y="395" width="840" height="58" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="419" font-size="13" font-weight="bold" fill="#333">Checked afterwards:</text>
  <text x="168" y="419" font-size="13" fill="#333">after test games, and in the tests, every input that was sent is read back</text>
  <text x="36" y="439" font-size="13" fill="#333">and flagged if a private record appears in the input of a player who is not entitled to it.</text>
</svg>
