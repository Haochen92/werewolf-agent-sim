<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>One game cycle: day, night, resolution, morning report</title>
  <rect width="760" height="470" fill="#ffffff"/>

  <!-- Day -->
  <rect x="30" y="30" width="300" height="140" rx="12" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <text x="50" y="60" font-size="18" font-weight="bold" fill="#5c4410">Day</text>
  <text x="50" y="86" font-size="14" fill="#333">Openings, then open discussion,</text>
  <text x="50" y="106" font-size="14" fill="#333">then a vote: one player is voted out.</text>
  <text x="50" y="132" font-size="13" fill="#7a5c14" font-style="italic">Said in public: claims, accusations, votes.</text>
  <text x="50" y="154" font-size="12" fill="#777">Day 1: openings only, no vote.</text>

  <!-- Night -->
  <rect x="430" y="30" width="300" height="140" rx="12" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="2"/>
  <text x="450" y="60" font-size="18" font-weight="bold" fill="#26325a">Night</text>
  <text x="450" y="86" font-size="14" fill="#333">The wolves choose a victim in private;</text>
  <text x="450" y="106" font-size="14" fill="#333">each role uses its ability on a player.</text>
  <text x="450" y="132" font-size="13" fill="#3b4a7a" font-style="italic">Learned in private: each seat's own</text>
  <text x="450" y="150" font-size="13" fill="#3b4a7a" font-style="italic">results, true but partial.</text>

  <!-- Resolution -->
  <rect x="430" y="300" width="300" height="140" rx="12" fill="#ede7f6" stroke="#6a4c93" stroke-width="2"/>
  <text x="450" y="330" font-size="18" font-weight="bold" fill="#3d2a5c">Resolution</text>
  <text x="450" y="356" font-size="14" fill="#333">Every night action is applied at once,</text>
  <text x="450" y="376" font-size="14" fill="#333">by the rules: blocks, protections,</text>
  <text x="450" y="396" font-size="14" fill="#333">attacks. The game never reports a</text>
  <text x="450" y="416" font-size="14" fill="#333">false result.</text>

  <!-- Morning report -->
  <rect x="30" y="300" width="300" height="140" rx="12" fill="#fdebd8" stroke="#c4732e" stroke-width="2"/>
  <text x="50" y="330" font-size="18" font-weight="bold" fill="#5c3410">Morning report</text>
  <text x="50" y="356" font-size="14" fill="#333">Who died in the night, and what kind</text>
  <text x="50" y="376" font-size="14" fill="#333">of attacker killed them. A dead</text>
  <text x="50" y="396" font-size="14" fill="#333">player's role is revealed, unless</text>
  <text x="50" y="416" font-size="14" fill="#333">an illusion hides it.</text>

  <!-- Game over -->
  <rect x="285" y="200" width="190" height="70" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="228" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Game over</text>
  <text x="380" y="248" font-size="12.5" fill="#555" text-anchor="middle">a side meets its win</text>
  <text x="380" y="263" font-size="12.5" fill="#555" text-anchor="middle">condition, or day 12</text>

  <!-- The cycle -->
  <line x1="330" y1="100" x2="420" y2="100" stroke="#444" stroke-width="2"/>
  <polygon points="430,100 418,94 418,106" fill="#444"/>
  <text x="379" y="90" font-size="12" fill="#555" text-anchor="middle">night falls</text>
  <line x1="580" y1="170" x2="580" y2="290" stroke="#444" stroke-width="2"/>
  <polygon points="580,300 574,288 586,288" fill="#444"/>
  <text x="590" y="232" font-size="12" fill="#555">every choice in</text>
  <line x1="430" y1="400" x2="340" y2="400" stroke="#444" stroke-width="2"/>
  <polygon points="330,400 342,394 342,406" fill="#444"/>
  <text x="381" y="390" font-size="12" fill="#555" text-anchor="middle">dawn</text>
  <line x1="180" y1="300" x2="180" y2="180" stroke="#444" stroke-width="2"/>
  <polygon points="180,170 174,182 186,182" fill="#444"/>
  <text x="170" y="242" font-size="12" fill="#555" text-anchor="end">next day</text>

  <!-- Exits -->
  <line x1="300" y1="170" x2="313" y2="190" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="318,198 316.8,186.9 308.4,192.3" fill="#888"/>
  <line x1="460" y1="300" x2="447" y2="280" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="442,272 451.6,277.7 443.2,283.1" fill="#888"/>
</svg>
