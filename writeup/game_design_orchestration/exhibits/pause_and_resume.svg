<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>A human's vote pauses the step; on resume the step re-runs, AI turns replay from cache</title>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- Panel A: the pause -->
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#222">1. The human's turn pauses the game</text>
  <rect x="30" y="50" width="380" height="215" rx="12" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="44" y="74" font-size="13" fill="#555">The day's vote: every seat answers in parallel,</text>
  <text x="44" y="92" font-size="13" fill="#555">inside a subgraph called from one game node.</text>

  <rect x="44" y="110" width="84" height="100" rx="8" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="1.5"/>
  <text x="86" y="134" font-size="14" font-weight="bold" fill="#26325a" text-anchor="middle">AI 1</text>
  <text x="86" y="160" font-size="12" fill="#333" text-anchor="middle">ballot cast</text>
  <rect x="136" y="110" width="84" height="100" rx="8" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="1.5"/>
  <text x="178" y="134" font-size="14" font-weight="bold" fill="#26325a" text-anchor="middle">AI 2</text>
  <text x="178" y="160" font-size="12" fill="#333" text-anchor="middle">ballot cast</text>
  <rect x="228" y="110" width="84" height="100" rx="8" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="1.5"/>
  <text x="270" y="134" font-size="14" font-weight="bold" fill="#26325a" text-anchor="middle">AI 3</text>
  <text x="270" y="160" font-size="12" fill="#333" text-anchor="middle">ballot cast</text>
  <rect x="320" y="110" width="84" height="100" rx="8" fill="#fdebd8" stroke="#c4732e" stroke-width="1.5"/>
  <text x="362" y="134" font-size="14" font-weight="bold" fill="#5c3410" text-anchor="middle">Human</text>
  <rect x="354" y="146" width="5" height="16" fill="#c4732e"/>
  <rect x="364" y="146" width="5" height="16" fill="#c4732e"/>
  <text x="362" y="182" font-size="12" fill="#333" text-anchor="middle">paused,</text>
  <text x="362" y="198" font-size="12" fill="#333" text-anchor="middle">waiting</text>

  <text x="44" y="240" font-size="12.5" fill="#555">The AI ballots are cast, but the step they</text>
  <text x="44" y="256" font-size="12.5" fill="#555">belong to has not finished.</text>

  <rect x="30" y="282" width="380" height="54" rx="8" fill="#eef5ec" stroke="#4f8a4a" stroke-width="1.5"/>
  <text x="220" y="305" font-size="13" font-weight="bold" fill="#2c5a28" text-anchor="middle">Checkpoint saved under the game's id</text>
  <text x="220" y="324" font-size="12" fill="#2c5a28" text-anchor="middle">in PostgreSQL, so the pause survives a restart</text>

  <!-- Between the panels -->
  <line x1="414" y1="160" x2="456" y2="160" stroke="#444" stroke-width="2"/>
  <polygon points="466,160 454,154 454,166" fill="#444"/>
  <text x="440" y="186" font-size="11.5" fill="#555" text-anchor="middle">human</text>
  <text x="440" y="200" font-size="11.5" fill="#555" text-anchor="middle">answers</text>

  <!-- Panel B: the resume -->
  <text x="470" y="34" font-size="16" font-weight="bold" fill="#222">2. The answer resumes it</text>
  <rect x="470" y="50" width="380" height="215" rx="12" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="484" y="74" font-size="13" fill="#555">To the framework the subgraph is one step,</text>
  <text x="484" y="92" font-size="13" fill="#555">so the whole step runs again from the top.</text>

  <rect x="484" y="110" width="84" height="100" rx="8" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="1.5"/>
  <text x="526" y="134" font-size="14" font-weight="bold" fill="#26325a" text-anchor="middle">AI 1</text>
  <text x="526" y="160" font-size="12" fill="#333" text-anchor="middle">cache hit:</text>
  <text x="526" y="176" font-size="12" fill="#333" text-anchor="middle">same ballot,</text>
  <text x="526" y="192" font-size="12" fill="#333" text-anchor="middle">no model call</text>
  <rect x="576" y="110" width="84" height="100" rx="8" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="1.5"/>
  <text x="618" y="134" font-size="14" font-weight="bold" fill="#26325a" text-anchor="middle">AI 2</text>
  <text x="618" y="160" font-size="12" fill="#333" text-anchor="middle">cache hit:</text>
  <text x="618" y="176" font-size="12" fill="#333" text-anchor="middle">same ballot,</text>
  <text x="618" y="192" font-size="12" fill="#333" text-anchor="middle">no model call</text>
  <rect x="668" y="110" width="84" height="100" rx="8" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="1.5"/>
  <text x="710" y="134" font-size="14" font-weight="bold" fill="#26325a" text-anchor="middle">AI 3</text>
  <text x="710" y="160" font-size="12" fill="#333" text-anchor="middle">cache hit:</text>
  <text x="710" y="176" font-size="12" fill="#333" text-anchor="middle">same ballot,</text>
  <text x="710" y="192" font-size="12" fill="#333" text-anchor="middle">no model call</text>
  <rect x="760" y="110" width="84" height="100" rx="8" fill="#fdebd8" stroke="#c4732e" stroke-width="1.5"/>
  <text x="802" y="134" font-size="14" font-weight="bold" fill="#5c3410" text-anchor="middle">Human</text>
  <text x="802" y="160" font-size="12" fill="#333" text-anchor="middle">uncached</text>
  <text x="802" y="176" font-size="12" fill="#333" text-anchor="middle">twin: takes</text>
  <text x="802" y="192" font-size="12" fill="#333" text-anchor="middle">the answer</text>

  <text x="484" y="240" font-size="12.5" fill="#555">The answer is validated like a model's reply</text>
  <text x="484" y="256" font-size="12.5" fill="#555">and takes the same path to the vote.</text>

  <rect x="470" y="282" width="380" height="54" rx="8" fill="#ede7f6" stroke="#6a4c93" stroke-width="1.5"/>
  <text x="660" y="305" font-size="13" font-weight="bold" fill="#3d2a5c" text-anchor="middle">All four ballots collected</text>
  <text x="660" y="324" font-size="12" fill="#3d2a5c" text-anchor="middle">then the vote resolves, once</text>

  <!-- Footer -->
  <line x1="30" y1="362" x2="850" y2="362" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="388" font-size="13" fill="#333">Without the cache (the first test game, 2026-08-19), the resume asked every AI voter again, and some</text>
  <text x="30" y="406" font-size="13" fill="#333">changed their votes.</text>
  <text x="30" y="434" font-size="13" fill="#333">The cache key is the turn's input written as canonical JSON, so it survives the checkpoint's save</text>
  <text x="30" y="452" font-size="13" fill="#333">and reload; since 2026-10-26 it also includes the game id.</text>
</svg>
