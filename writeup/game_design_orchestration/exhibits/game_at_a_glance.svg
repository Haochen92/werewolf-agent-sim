<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="Helvetica, Arial, sans-serif">
  <title>The game at a glance: ten players on four sides, who knows what, and one day and night</title>
  <rect width="880" height="600" fill="#ffffff"/>

  <!-- A. Ten players, four sides -->
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Ten players, four sides</text>

  <!-- Town -->
  <rect x="20" y="42" width="400" height="190" rx="12" fill="#fffaf0" stroke="#c99a2e" stroke-width="2"/>
  <text x="36" y="68" font-size="16" font-weight="bold" fill="#5c4410">Town · 6</text>
  <circle cx="60" cy="104" r="20" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <circle cx="124" cy="104" r="20" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <circle cx="188" cy="104" r="20" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <circle cx="252" cy="104" r="20" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <circle cx="316" cy="104" r="20" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <circle cx="380" cy="104" r="20" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <text x="60" y="142" font-size="11" fill="#333" text-anchor="middle">Investigator</text>
  <text x="124" y="142" font-size="11" fill="#333" text-anchor="middle">Sentinel</text>
  <text x="188" y="142" font-size="11" fill="#333" text-anchor="middle">Trailseer</text>
  <text x="252" y="142" font-size="11" fill="#333" text-anchor="middle">Vigilante</text>
  <text x="316" y="142" font-size="11" fill="#333" text-anchor="middle">Sigilist</text>
  <text x="380" y="142" font-size="11" fill="#333" text-anchor="middle">Healer</text>
  <text x="124" y="160" font-size="10.5" fill="#7a5c14" text-anchor="middle" font-style="italic">learn things at night</text>
  <text x="284" y="160" font-size="10.5" fill="#7a5c14" text-anchor="middle" font-style="italic">can kill</text>
  <text x="380" y="160" font-size="10.5" fill="#7a5c14" text-anchor="middle" font-style="italic">protects</text>
  <text x="36" y="192" font-size="13" fill="#333">Has the numbers, but not the facts.</text>
  <text x="36" y="212" font-size="13" fill="#333">Wins by voting out the wolves and the lone killer.</text>

  <!-- Wolves -->
  <rect x="435" y="42" width="150" height="190" rx="12" fill="#fdf3f3" stroke="#a33b3b" stroke-width="2"/>
  <text x="451" y="68" font-size="16" font-weight="bold" fill="#6b1f1f">Wolves · 2</text>
  <circle cx="478" cy="104" r="20" fill="#f6dede" stroke="#a33b3b" stroke-width="2"/>
  <circle cx="542" cy="104" r="20" fill="#f6dede" stroke="#a33b3b" stroke-width="2"/>
  <line x1="498" y1="104" x2="522" y2="104" stroke="#a33b3b" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="478" y="142" font-size="11" fill="#333" text-anchor="middle">Chanteuse</text>
  <text x="542" y="142" font-size="11" fill="#333" text-anchor="middle">Illusionist</text>
  <text x="451" y="174" font-size="13" fill="#333">Know each other.</text>
  <text x="451" y="192" font-size="13" fill="#333">Pass as town until</text>
  <text x="451" y="210" font-size="13" fill="#333">they outnumber it.</text>

  <!-- Lone killer -->
  <rect x="600" y="42" width="130" height="190" rx="12" fill="#f7f4ef" stroke="#6b5640" stroke-width="2"/>
  <text x="616" y="68" font-size="16" font-weight="bold" fill="#3d2f20">Lone killer · 1</text>
  <circle cx="665" cy="104" r="20" fill="#e9e1d6" stroke="#6b5640" stroke-width="2"/>
  <text x="665" y="142" font-size="11" fill="#333" text-anchor="middle">Serial Killer</text>
  <text x="665" y="156" font-size="11" fill="#333" text-anchor="middle">or Necromancer</text>
  <text x="616" y="192" font-size="13" fill="#333">Works alone;</text>
  <text x="616" y="210" font-size="13" fill="#333">last one standing.</text>

  <!-- Neutral -->
  <rect x="745" y="42" width="115" height="190" rx="12" fill="#f1f8f6" stroke="#3e7d6f" stroke-width="2"/>
  <text x="761" y="68" font-size="16" font-weight="bold" fill="#1f4a40">Neutral · 1</text>
  <circle cx="802" cy="104" r="20" fill="#e0efeb" stroke="#3e7d6f" stroke-width="2"/>
  <text x="802" y="142" font-size="11" fill="#333" text-anchor="middle">Speculator</text>
  <text x="802" y="156" font-size="11" fill="#333" text-anchor="middle">or Fortune Teller</text>
  <text x="761" y="186" font-size="13" fill="#333">Its own goal,</text>
  <text x="761" y="204" font-size="13" fill="#333">e.g. back the</text>
  <text x="761" y="222" font-size="13" fill="#333">winning side.</text>

  <!-- B. Who knows what -->
  <text x="20" y="268" font-size="16" font-weight="bold" fill="#222">Who knows what</text>
  <rect x="20" y="280" width="410" height="96" rx="10" fill="#eef5ec" stroke="#4f8a4a" stroke-width="1.5"/>
  <text x="36" y="304" font-size="14" font-weight="bold" fill="#2c5a28">Public: everyone sees it</text>
  <text x="36" y="326" font-size="13" fill="#333">The roles in the lineup, though not who holds them</text>
  <text x="36" y="345" font-size="13" fill="#333">Everything said in discussion, and every vote</text>
  <text x="36" y="364" font-size="13" fill="#333">The morning report: who died overnight</text>
  <rect x="450" y="280" width="410" height="96" rx="10" fill="#fdebd8" stroke="#c4732e" stroke-width="1.5"/>
  <text x="466" y="304" font-size="14" font-weight="bold" fill="#5c3410">Private: only some players see it</text>
  <text x="466" y="326" font-size="13" fill="#333">Each player's own role</text>
  <text x="466" y="345" font-size="13" fill="#333">Each player's own night results</text>
  <text x="466" y="364" font-size="13" fill="#333">The wolves: each other's identity and their chat</text>

  <!-- C. One day and night -->
  <text x="20" y="412" font-size="16" font-weight="bold" fill="#222">One day and night</text>
  <rect x="20" y="424" width="190" height="96" rx="10" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
  <text x="34" y="448" font-size="15" font-weight="bold" fill="#5c4410">Day</text>
  <text x="34" y="470" font-size="13" fill="#333">Discussion, then a vote</text>
  <text x="34" y="488" font-size="13" fill="#333">that may remove a player.</text>
  <text x="34" y="508" font-size="12" fill="#777">Day 1: openings only.</text>

  <rect x="245" y="424" width="190" height="96" rx="10" fill="#e3e8f5" stroke="#4a5a8c" stroke-width="2"/>
  <text x="259" y="448" font-size="15" font-weight="bold" fill="#26325a">Night</text>
  <text x="259" y="470" font-size="13" fill="#333">Wolves pick a victim in</text>
  <text x="259" y="488" font-size="13" fill="#333">their chat; other roles</text>
  <text x="259" y="506" font-size="13" fill="#333">choose targets alone.</text>

  <rect x="470" y="424" width="190" height="96" rx="10" fill="#ede7f6" stroke="#6a4c93" stroke-width="2"/>
  <text x="484" y="448" font-size="15" font-weight="bold" fill="#3d2a5c">Resolution</text>
  <text x="484" y="470" font-size="13" fill="#333">The rules apply every</text>
  <text x="484" y="488" font-size="13" fill="#333">choice together: blocks,</text>
  <text x="484" y="506" font-size="13" fill="#333">protections, attacks.</text>

  <rect x="695" y="424" width="165" height="96" rx="10" fill="#fdebd8" stroke="#c4732e" stroke-width="2"/>
  <text x="709" y="448" font-size="15" font-weight="bold" fill="#5c3410">Morning</text>
  <text x="709" y="470" font-size="13" fill="#333">Public: who died.</text>
  <text x="709" y="488" font-size="13" fill="#333">Private: each</text>
  <text x="709" y="506" font-size="13" fill="#333">player's results.</text>

  <line x1="210" y1="472" x2="235" y2="472" stroke="#444" stroke-width="2"/>
  <polygon points="245,472 233,466 233,478" fill="#444"/>
  <line x1="435" y1="472" x2="460" y2="472" stroke="#444" stroke-width="2"/>
  <polygon points="470,472 458,466 458,478" fill="#444"/>
  <line x1="660" y1="472" x2="685" y2="472" stroke="#444" stroke-width="2"/>
  <polygon points="695,472 683,466 683,478" fill="#444"/>

  <!-- next day -->
  <polyline points="777,520 777,548 115,548 115,532" fill="none" stroke="#444" stroke-width="2"/>
  <polygon points="115,521 109,533 121,533" fill="#444"/>
  <text x="446" y="542" font-size="12" fill="#555" text-anchor="middle">next day</text>
  <text x="20" y="582" font-size="12.5" fill="#555">The game ends when a side meets its win condition, checked after each vote and each night.</text>
</svg>
