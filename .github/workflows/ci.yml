# The backend's tests, one step per level.
# docs/testing.md describes the levels and the markers. Each step answers one question, so a red
# run says which kind of check failed:
#
#   quick        everything that needs no service and is not slow        (about 1 minute)
#   integration  the tests that need Postgres; a container is started by the test run itself
#   slow         the ten deduction tests over thousands of random nights (about 8 minutes)
#   image        the server image builds from poetry.lock and the server starts in it
#
# Never run here: the `contract` tests, which call real model providers and cost money. No
# provider key is stored in this repository's secrets, and the keys below are made up: some
# modules build a provider client when they are imported, and the client only checks that a key
# is present. No test sends a request with them.
#
# The frontend's checks are not here yet.

# The runner is named exactly, not "ubuntu-latest". The project needs Python 3.11.12 exactly
# (pyproject.toml), and GitHub builds each Python version for particular Ubuntu releases: when
# "latest" moved to Ubuntu 26.04, 3.11.12 was not available there and the first run of this file
# failed at "Set up Python". The ARM runner is the processor type of the machine the server is
# developed and deployed on, so the image job builds what the host would build.

name: CI

# Two sizes of run:
#   - every push to any branch: the lock check, the lint report, the quick tests and the timing
#     tests (about four minutes). The work here is done on long-lived branches, so this is the
#     feedback while working.
#   - a push to main and a pull request to main: the same, then the integration tests, the slow
#     tests and the image job. main is what gets deployed, so the full run happens where a fault
#     must be stopped. "Run workflow" on the Actions page also does the full run on any branch.
#
# A change to Markdown files, the write-up, the frontend or the evidence record alone starts no
# run: none of those can change a backend test's result. The one exception inside evidence/ is
# the folder of saved game data that four test files read. A later pattern overrides an earlier
# one, so the order of the list matters.
# (The list is written twice because GitHub Actions does not read YAML merge keys.)
on:
  push:
    paths:
      - "**"
      - "!**.md"
      - "!writeup/**"
      - "!frontend/**"
      - "!evidence/**"
      - "evidence/gameplay/deduction/data/**"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!writeup/**"
      - "!frontend/**"
      - "!evidence/**"
      - "evidence/gameplay/deduction/data/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENROUTER_API_KEY: made-up-for-ci
  OPENAI_API_KEY: made-up-for-ci
  CLAUDE_API_KEY: made-up-for-ci
  GOOGLE_API_KEY: made-up-for-ci
  DEEPSEEK_API_KEY: made-up-for-ci
  LANGFUSE_TRACING_ENABLED: "false"

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached environment
        id: cached-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      # --no-root: the tests import Agents/, server/ and evaluation/ from the checkout
      # (pytest's pythonpath), so the project itself is not installed as a package.
      - name: Install dependencies from the lock file
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: The lock file matches pyproject.toml
        run: poetry check --lock

      # Reported, not enforced: the code has lint findings that predate CI (405 on 2026-11-18).
      - name: Lint (does not fail the run)
        continue-on-error: true
        run: poetry run ruff check . --statistics

      - name: Quick tests
        run: poetry run pytest -q -m "not contract and not slow and not integration and not timing"

      # Six tests that wait real time and assert a time window. A busy runner can make one fail
      # without a fault in the code, so a failure here is shown and does not fail the run.
      - name: Timing tests (do not fail the run)
        continue-on-error: true
        run: poetry run pytest -q -m timing

      # From here on: the full run only (see the top of this file).
      - name: Integration tests (Postgres in a container)
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: poetry run pytest -q -m integration

      - name: Slow tests
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: poetry run pytest -q -m slow

  image:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Build the server image from the lock file
        run: docker build -t wolf-server:ci --build-arg GIT_COMMIT=${{ github.sha }} .

      # No database and made-up keys: this shows that the image holds every package the server
      # imports and that the server starts. It does not show that a game can be played.
      - name: The server starts and answers
        run: |
          docker run -d --name wolf-ci \
            -e OPENROUTER_API_KEY -e OPENAI_API_KEY -e CLAUDE_API_KEY -e GOOGLE_API_KEY \
            -e LANGFUSE_TRACING_ENABLED wolf-server:ci
          for attempt in $(seq 1 20); do
            if docker exec wolf-ci curl -fsS http://localhost:8000/health; then
              docker exec wolf-ci curl -fsS -o /dev/null http://localhost:8000/models
              exit 0
            fi
            sleep 2
          done
          docker logs wolf-ci
          exit 1
